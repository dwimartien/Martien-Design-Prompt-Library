<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title> Prompt Library | Martien Design</title>
<meta name="description" content="Kelola dan gunakan kembali prompt AI - kategori, koleksi, variabel dinamis, dan riwayat versi.">
<meta name="theme-color" content="#4F63F6">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prompts">
<style>
:root{
  --bg:#F7F8FA; --surface:#FFFFFF; --bg-soft:#F1F3F6; --border:#E5E8EC;
  --text:#1A1D23; --text-secondary:#6B7280; --accent:#4F63F6; --accent-soft:#EEF0FE;
  --success:#16A34A; --success-soft:#E9F9EF; --warning:#D97706; --warning-soft:#FDF3E4;
  --danger:#DC2626; --danger-soft:#FDEBEB; --purple:#8B5CF6; --purple-soft:#F2EDFE;
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px;
  --shadow-card:0 1px 2px rgba(20,20,30,.04), 0 1px 8px rgba(20,20,30,.04);
  --shadow-pop:0 12px 40px rgba(20,20,30,.16);
}
body.dark{
  --bg:#14161C; --surface:#1C1F27; --bg-soft:#22252E; --border:#2C303B;
  --text:#EDEFF3; --text-secondary:#8B93A3; --accent:#6B7CF9; --accent-soft:#242A4A;
  --success:#34D399; --success-soft:#123024; --warning:#FBBF24; --warning-soft:#332708;
  --danger:#F87171; --danger-soft:#3A1E1E; --purple:#A78BFA; --purple-soft:#291F49;
  --shadow-card:0 1px 2px rgba(0,0,0,.3), 0 1px 8px rgba(0,0,0,.25);
  --shadow-pop:0 12px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
  font-size:14px; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;color:inherit;}
button{cursor:pointer;}
a{color:inherit;text-decoration:none;}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

/* ---------- App shell ---------- */
#app{display:flex;height:100vh;overflow:hidden;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:264px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:18px 14px;overflow-y:auto;transition:margin-left .2s ease;
}
.sidebar.collapsed{margin-left:-264px;}
.brand-row{display:flex;align-items:center;gap:10px;padding:4px 6px 18px 6px;}
.brand-logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;flex-shrink:0;}
.brand-name{font-weight:800;font-size:15.5px;flex:1;}
.sidebar-collapse-btn{background:none;border:none;color:var(--text-secondary);padding:6px;border-radius:8px;display:flex;}
.sidebar-collapse-btn:hover{background:var(--bg-soft);}

.nav-section{margin-bottom:6px;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;font-size:13.5px;font-weight:600;
  color:var(--text-secondary);border:none;background:none;width:100%;text-align:left;margin-bottom:2px;
}
.nav-item:hover{background:var(--bg-soft);color:var(--text);}
.nav-item.active{background:var(--accent-soft);color:var(--accent);}
.nav-item svg{width:17px;height:17px;}
.nav-item .nav-count{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--text-secondary);background:var(--bg-soft);padding:1px 7px;border-radius:999px;}
.nav-item.active .nav-count{color:var(--accent);background:var(--surface);}

.sidebar-heading{
  display:flex;align-items:center;justify-content:space-between;padding:16px 10px 6px 10px;
  font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--text-secondary);text-transform:uppercase;
}
.sidebar-heading button{background:none;border:none;color:var(--text-secondary);padding:2px;border-radius:6px;display:flex;}
.sidebar-heading button:hover{background:var(--bg-soft);color:var(--text);}
.cat-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;font-size:13.5px;color:var(--text);border:none;background:none;width:100%;text-align:left;}
.cat-item:hover{background:var(--bg-soft);}
.cat-item.active{background:var(--accent-soft);color:var(--accent);font-weight:700;}
.cat-item .cat-emoji{font-size:15px;width:20px;text-align:center;}
.cat-item .cat-count{margin-left:auto;font-size:11.5px;color:var(--text-secondary);}
.cat-item-row{position:relative;}
.cat-item-row .cat-del{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:none;background:none;border:none;color:var(--text-secondary);padding:3px;border-radius:6px;}
.cat-item-row:hover .cat-del{display:flex;}
.cat-item-row .cat-del:hover{background:var(--danger-soft);color:var(--danger);}
.cat-item-row .cat-del svg{width:13px;height:13px;}

.sidebar-bottom{margin-top:auto;padding-top:10px;border-top:1px solid var(--border);}

/* ---------- Topbar ---------- */
.main-col{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh;overflow:hidden;}
.topbar{
  display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;
}
.hamburger-btn{display:none;background:none;border:none;color:var(--text);padding:4px;}
.search-wrap{flex:1;position:relative;max-width:520px;}
.search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-secondary);}
.search-wrap input{
  width:100%;padding:9px 14px 9px 38px;border-radius:10px;border:1px solid var(--border);background:var(--bg-soft);
  font-size:13.5px;outline:none;color:var(--text);
}
.search-wrap input:focus{border-color:var(--accent);background:var(--surface);}
.search-kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:10.5px;color:var(--text-secondary);background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:1px 5px;}
.topbar-spacer{flex:1;}
.icon-btn{background:none;border:1px solid transparent;color:var(--text-secondary);padding:8px;border-radius:9px;display:flex;}
.icon-btn:hover{background:var(--bg-soft);color:var(--text);}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;font-size:13.5px;font-weight:700;border:none;white-space:nowrap;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{filter:brightness(1.06);}
.btn-secondary{background:var(--bg-soft);color:var(--text);border:1px solid var(--border);}
.btn-secondary:hover{background:var(--border);}
.btn-ghost{background:none;color:var(--text-secondary);}
.btn-ghost:hover{background:var(--bg-soft);}
.btn-danger{background:var(--danger-soft);color:var(--danger);}
.btn-danger:hover{filter:brightness(0.95);}
.btn-sm{padding:6px 11px;font-size:12.5px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* ---------- Filter row ---------- */
.filter-row{display:flex;align-items:center;gap:9px;padding:14px 22px 0 22px;flex-wrap:wrap;flex-shrink:0;}
.filter-select{
  padding:8px 12px;border-radius:9px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:600;
  color:var(--text);outline:none;
}
.view-toggle{display:flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;margin-left:auto;}
.view-toggle button{background:var(--surface);border:none;padding:7px 10px;color:var(--text-secondary);}
.view-toggle button.active{background:var(--accent-soft);color:var(--accent);}

/* ---------- Content ---------- */
.content-scroll{flex:1;overflow-y:auto;padding:16px 22px 32px 22px;}
.content-heading{display:flex;align-items:baseline;gap:8px;margin:6px 0 14px 0;}
.content-heading h2{font-size:18px;margin:0;}
.content-heading span{color:var(--text-secondary);font-size:13px;}

.prompt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
.prompt-list{display:flex;flex-direction:column;gap:8px;}

.prompt-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;cursor:pointer;
  box-shadow:var(--shadow-card);transition:transform .12s ease, box-shadow .12s ease;display:flex;flex-direction:column;
}
.prompt-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(20,20,30,.10);}
.prompt-thumb{height:108px;display:flex;align-items:center;justify-content:center;font-size:38px;position:relative;flex-shrink:0;}
.prompt-fav-btn{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.85);border:none;border-radius:8px;padding:5px;display:flex;color:#C9CDD4;}
body.dark .prompt-fav-btn{background:rgba(20,20,20,.6);}
.prompt-fav-btn.active,.prompt-fav-btn:hover{color:#F5B400;}
.prompt-fav-btn svg{width:15px;height:15px;}
.prompt-body{padding:12px 14px 14px 14px;display:flex;flex-direction:column;gap:7px;flex:1;}
.prompt-title{font-size:14px;font-weight:700;line-height:1.3;}
.model-tags{display:flex;gap:5px;flex-wrap:wrap;}
.model-pill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;}
.prompt-desc{font-size:12px;color:var(--text-secondary);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1;}
.hashtags{display:flex;gap:5px;flex-wrap:wrap;}
.hashtag{font-size:11px;color:var(--accent);background:var(--accent-soft);padding:1px 7px;border-radius:6px;}
.prompt-footer{display:flex;align-items:center;justify-content:space-between;padding-top:6px;border-top:1px solid var(--border);margin-top:2px;}
.prompt-footer .edited{font-size:11px;color:var(--text-secondary);}
.prompt-footer .footer-actions{display:flex;gap:2px;}
.prompt-footer .footer-actions button{background:none;border:none;color:var(--text-secondary);padding:5px;border-radius:7px;}
.prompt-footer .footer-actions button:hover{background:var(--bg-soft);color:var(--text);}
.prompt-footer .footer-actions svg{width:14px;height:14px;}

.prompt-row{
  display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:11px 14px;cursor:pointer;box-shadow:var(--shadow-card);
}
.prompt-row:hover{background:var(--bg-soft);}
.prompt-row .prompt-thumb{width:44px;height:44px;border-radius:9px;font-size:20px;flex-shrink:0;}
.prompt-row .row-main{flex:1;min-width:0;}
.prompt-row .row-title{font-weight:700;font-size:13.5px;}
.prompt-row .row-sub{font-size:11.5px;color:var(--text-secondary);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prompt-row .row-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 20px;color:var(--text-secondary);text-align:center;gap:8px;}
.empty-state svg{width:44px;height:44px;opacity:.4;margin-bottom:6px;}
.empty-state h3{margin:0;color:var(--text);font-size:15px;}
.empty-state p{margin:0;font-size:13px;max-width:280px;}

.pagination{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:24px;}
.pagination button{
  min-width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12.5px;font-weight:600;
}
.pagination button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.pagination button:disabled{opacity:.4;}

/* ---------- Detail panel ---------- */
.detail-overlay{position:fixed;inset:0;background:rgba(15,17,22,.35);z-index:80;display:none;}
.detail-overlay.show{display:block;}
.detail-panel{
  position:fixed;top:0;right:0;height:100vh;width:480px;max-width:100vw;background:var(--surface);border-left:1px solid var(--border);
  box-shadow:var(--shadow-pop);z-index:90;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;
}
.detail-panel.show{transform:translateX(0);}
.detail-head{display:flex;align-items:flex-start;gap:10px;padding:18px 20px 12px 20px;border-bottom:1px solid var(--border);}
.detail-head-main{flex:1;min-width:0;}
.detail-head h3{margin:0 0 6px 0;font-size:17px;}
.detail-scroll{flex:1;overflow-y:auto;padding:16px 20px 32px 20px;}
.detail-tabs{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--border);}
.detail-tab{padding:10px 4px;font-size:13px;font-weight:700;color:var(--text-secondary);border:none;background:none;border-bottom:2px solid transparent;margin-right:16px;}
.detail-tab.active{color:var(--accent);border-color:var(--accent);}
.section-label{font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--text-secondary);text-transform:uppercase;margin-bottom:8px;}
.editor-box{border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg-soft);overflow:hidden;margin-bottom:18px;}
.editor-lines{display:flex;font-family:"SF Mono",Consolas,Menlo,monospace;font-size:12.5px;line-height:1.7;}
.editor-linenum{padding:12px 10px;color:var(--text-secondary);text-align:right;user-select:none;background:var(--bg-soft);border-right:1px solid var(--border);white-space:pre;}
.editor-text{flex:1;padding:12px 12px;border:none;background:none;resize:vertical;outline:none;color:var(--text);min-height:140px;width:100%;}
.editor-text .var-token{color:var(--accent);font-weight:700;}
.var-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
.var-field{border:1px solid var(--border);border-radius:9px;padding:8px 10px;background:var(--surface);}
.var-field label{display:block;font-size:10px;font-weight:800;letter-spacing:.4px;color:var(--text-secondary);margin-bottom:3px;}
.var-field input{border:none;background:none;width:100%;font-size:13px;font-weight:600;outline:none;color:var(--text);padding:0;}
.detail-actions{display:flex;gap:9px;margin-bottom:20px;}
.stat-mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.stat-mini{border:1px solid var(--border);border-radius:9px;padding:10px 12px;background:var(--bg-soft);}
.stat-mini .stat-mini-label{font-size:10.5px;color:var(--text-secondary);font-weight:700;margin-bottom:3px;}
.stat-mini .stat-mini-value{font-size:17px;font-weight:800;}
.models-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.model-badge{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;}
.complexity-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700;}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(15,17,22,.4);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.show{display:flex;}
.modal-box{background:var(--surface);border-radius:var(--radius-lg);width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--shadow-pop);}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);}
.modal-head h3{margin:0;font-size:16px;}
.modal-body{padding:18px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:9px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:12.5px;font-weight:700;color:var(--text-secondary);}
.field input,.field select,.field textarea{
  padding:9px 12px;border:1px solid var(--border);border-radius:9px;font-size:13.5px;outline:none;background:var(--bg-soft);color:var(--text);width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:var(--surface);}
.field textarea{min-height:110px;resize:vertical;font-family:inherit;}
.chip-group{display:flex;gap:7px;flex-wrap:wrap;}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:var(--bg-soft);font-size:12.5px;font-weight:700;color:var(--text-secondary);}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.emoji-grid{display:flex;gap:6px;flex-wrap:wrap;}
.emoji-opt{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--bg-soft);font-size:17px;display:flex;align-items:center;justify-content:center;}
.emoji-opt.active{border-color:var(--accent);background:var(--accent-soft);}

/* ---------- Toast ---------- */
#toastRoot{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:#1c2333;color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.22);display:flex;align-items:center;gap:8px;}

/* ---------- Mobile ---------- */
.mobile-backdrop{position:fixed;inset:0;background:rgba(15,17,22,.4);z-index:70;display:none;}
.mobile-backdrop.show{display:block;}

@media (max-width:860px){
  .sidebar{position:fixed;top:0;left:0;z-index:75;transform:translateX(-100%);transition:transform .2s ease;margin-left:0;box-shadow:var(--shadow-pop);}
  .sidebar.mobile-open{transform:translateX(0);}
  .hamburger-btn{display:flex;}
  .detail-panel{width:100%;}
  .search-kbd{display:none;}
  .filter-row{padding:12px 14px 0 14px;}
  .content-scroll{padding:14px 14px 28px 14px;}
  .topbar{padding:12px 14px;}
  .prompt-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  .var-grid{grid-template-columns:1fr;}
  .stat-mini-grid{grid-template-columns:1fr 1fr;}
}

/* ---------- Auth ---------- */
.auth-screen{position:fixed;inset:0;z-index:150;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-pop);padding:36px 32px;max-width:360px;width:100%;text-align:center;}
.auth-card .brand-logo{margin:0 auto 16px auto;}
.auth-card h2{margin:0 0 6px 0;font-size:19px;}
.auth-card p{margin:0 0 22px 0;font-size:13px;color:var(--text-secondary);line-height:1.5;}
.btn-google{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px 16px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-weight:700;font-size:13.5px;color:var(--text);}
.btn-google:hover{background:var(--bg-soft);}
.btn-google:disabled{opacity:.6;cursor:not-allowed;}
.auth-status{font-size:12px;color:var(--text-secondary);margin-top:14px;min-height:16px;}
.user-badge{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:999px;background:var(--bg-soft);}
.user-badge img{width:26px;height:26px;border-radius:50%;display:block;}
.user-badge span{font-size:12.5px;font-weight:700;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
</style>
</head>
<body>
<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="brand-logo">P</div>
    <h2>Prompt Library</h2>
    <p>Masuk dengan akun Google untuk menyimpan dan menyinkronkan prompt kamu secara online.</p>
    <button class="btn-google" id="btnGoogleSignIn">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M23.5 12.3c0-.9-.1-1.6-.2-2.4H12v4.5h6.5c-.3 1.5-1.2 2.8-2.5 3.6v3h4C22.1 19 23.5 16 23.5 12.3z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-4-3c-1.1.8-2.5 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9h-4.1v3.1C3.3 21.4 7.3 24 12 24z"/><path fill="#FBBC05" d="M5.4 14.4c-.2-.7-.4-1.5-.4-2.4s.1-1.6.4-2.4V6.5H1.3C.5 8.1 0 9.9 0 12s.5 3.9 1.3 5.5l4.1-3.1z"/><path fill="#EA4335" d="M12 4.8c1.7 0 3.3.6 4.5 1.7l3.4-3.4C17.9 1.2 15.2 0 12 0 7.3 0 3.3 2.6 1.3 6.5l4.1 3.1c.9-2.8 3.5-4.8 6.6-4.8z"/></svg>
      <span>Masuk dengan Google</span>
    </button>
    <div class="auth-status" id="authStatus"></div>
  </div>
</div>

<div id="app">
  <div class="mobile-backdrop" id="mobileBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand-row">
      <div class="brand-logo">P</div>
      <div class="brand-name">Prompt Library</div>
      <button class="sidebar-collapse-btn" id="btnCollapseSidebar" title="Sembunyikan sidebar"></button>
    </div>

function docRefForUser(uid){
  return db.collection('promptLibraryUsers').doc(uid);
}

async function signInWithGoogle(){
  const btn = document.getElementById('btnGoogleSignIn');
  const statusEl = document.getElementById('authStatus');
  btn.disabled = true;
  statusEl.textContent = 'Menghubungkan ke Google...';
  try{
    const provider = new firebase.auth.GoogleAuthProvider();
    await auth.signInWithPopup(provider);
  }catch(e){
    statusEl.textContent = 'Gagal masuk: ' + (e.message || 'coba lagi.');
    btn.disabled = false;
  }
}
function signOutUser(){
  if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot = null; }
  auth.signOut();
}

function attachRealtimeListener(uid){
  const ref = docRefForUser(uid);
  unsubscribeSnapshot = ref.onSnapshot((snap)=>{
    if(snap.exists){
      const data = snap.data();
      prompts = data.prompts || [];
      categories = data.categories || defaultCategories();
      collections = data.collections || defaultCollections();
    } else {
      categories = defaultCategories();
      collections = defaultCollections();
      prompts = seedPrompts();
      ref.set({prompts, categories, collections, updatedAt: Date.now()});
    }
    render();
  }, (err)=>{
    console.error('Firestore sync error', err);
    toast('Gagal sinkronisasi data online.');
  });
}

function saveData(){
  if(!currentUser) return;
  docRefForUser(currentUser.uid)
    .set({prompts, categories, collections, updatedAt: Date.now()}, {merge:true})
    .catch((e)=>{ console.error('Save error', e); toast('Gagal menyimpan ke cloud.'); });
}

function showAuthScreen(show){
  document.getElementById('authScreen').style.display = show ? 'flex' : 'none';
}
function updateUserBadge(user){
  const badge = document.getElementById('userBadge');
  const logoutBtn = document.getElementById('btnLogout');
  if(user){
    badge.style.display='flex';
    logoutBtn.style.display='flex';
    logoutBtn.innerHTML = ICONS.close;
    const photo = user.photoURL ? `<img src="${user.photoURL}" alt="">` : '';
    badge.innerHTML = `${photo}<span>${esc(user.displayName || user.email || 'Pengguna')}</span>`;
  } else {
    badge.style.display='none';
    logoutBtn.style.display='none';
    badge.innerHTML='';
  }
}

auth.onAuthStateChanged((user)=>{
  currentUser = user;
  updateUserBadge(user);
  if(user){
    const statusEl = document.getElementById('authStatus');
    if(statusEl) statusEl.textContent = '';
    const btn = document.getElementById('btnGoogleSignIn');
    if(btn) btn.disabled = false;
    showAuthScreen(false);
    attachRealtimeListener(user.uid);
  } else {
    if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot=null; }
    prompts = []; categories = []; collections = [];
    showAuthScreen(true);
  }

/* ================================================================
   VARIABLES & STATS
   ================================================================ */
function detectVariables(text){
  const re = /\{\{\s*([A-Za-z0-9_\-]+)\s*\}\}/g;
  const found = []; let m;
  while((m=re.exec(text||''))){
    if(!found.includes(m[1])) found.push(m[1]);
  }
  return found;
}
function substituteVariables(text, values){
  return (text||'').replace(/\{\{\s*([A-Za-z0-9_\-]+)\s*\}\}/g, (m,name)=> (values&&values[name]) ? values[name] : m);
}
function computeStats(text){
  text = text||'';
  const words = (text.trim().match(/\S+/g)||[]).length;
  const chars = text.length;
  const tokens = Math.max(1, Math.round(chars/4));
  const vars = detectVariables(text).length;
  let complexity = 'Sederhana', level=1;
  const score = words + vars*8;
  if(score>220){ complexity='Kompleks'; level=3; }
  else if(score>90){ complexity='Menengah'; level=2; }
  return {words,chars,tokens,vars,complexity,level};
}
function complexityColor(level){
  return level===3?'#DC2626':level===2?'#D97706':'#16A34A';
}
function timeAgo(ts){
  const diff = Date.now()-ts;
  const dayMs = 86400000;
  if(diff < 3600000) return Math.max(1,Math.round(diff/60000))+' menit lalu';
  if(diff < dayMs) return Math.round(diff/3600000)+' jam lalu';
  const d = Math.round(diff/dayMs);
  if(d<30) return d+' hari lalu';
  if(d<365) return Math.round(d/30)+' bulan lalu';
  return Math.round(d/365)+' tahun lalu';
}

function getPromptById(id){ return prompts.find(p=>p.id===id); }
function catOf(id){ return categories.find(c=>c.id===id); }
function catColor(catId){
  const idx = categories.findIndex(c=>c.id===catId);
  return CAT_COLORS[(idx<0?0:idx) % CAT_COLORS.length];
}
function collectVarInputs(){
  const vals = {};
  document.querySelectorAll('[data-varname]').forEach(inp=>{ vals[inp.dataset.varname]=inp.value; });
  return vals;
}

/* ================================================================
   FILTER / SORT / SCOPE
   ================================================================ */
function getScopedPrompts(){
  let list = prompts.slice();
  if(ui.nav==='trash'){
    list = list.filter(p=>p.deleted);
  } else {
    list = list.filter(p=>!p.deleted);
    if(ui.nav==='favorites') list = list.filter(p=>p.favorite);
    else if(ui.nav.startsWith('cat:')) list = list.filter(p=>p.categoryId===ui.nav.slice(4));
    else if(ui.nav.startsWith('col:')) list = list.filter(p=>(p.collectionIds||[]).includes(ui.nav.slice(4)));
  }
  if(ui.search.trim()){
    const q = ui.search.trim().toLowerCase();
    list = list.filter(p=>
      p.title.toLowerCase().includes(q) ||
      (p.description||'').toLowerCase().includes(q) ||
      (p.tags||[]).some(t=>t.toLowerCase().includes(q)) ||
      (p.content||'').toLowerCase().includes(q)
    );
  }
  if(ui.nav!=='trash'){
    if(ui.filterModel) list = list.filter(p=>p.models.includes(ui.filterModel));
    if(ui.filterCategory) list = list.filter(p=>p.categoryId===ui.filterCategory);
    if(ui.filterStatus) list = list.filter(p=>p.status===ui.filterStatus);
  }
  switch(ui.sort){
    case 'oldest': list.sort((a,b)=>a.createdAt-b.createdAt); break;
    case 'az': list.sort((a,b)=>a.title.localeCompare(b.title)); break;
    case 'favorite': list.sort((a,b)=>(b.favorite-a.favorite) || (b.updatedAt-a.updatedAt)); break;
    default: list.sort((a,b)=>b.updatedAt-a.updatedAt);
  }
  return list;
}
function navLabel(){
  if(ui.nav==='all') return 'Semua Prompt';
  if(ui.nav==='favorites') return 'Favorit';
  if(ui.nav==='trash') return 'Sampah';
  if(ui.nav==='settings') return 'Pengaturan';
  if(ui.nav.startsWith('cat:')){ const c=catOf(ui.nav.slice(4)); return c? c.name : 'Kategori'; }
  if(ui.nav.startsWith('col:')){ const c=collections.find(x=>x.id===ui.nav.slice(4)); return c? c.name : 'Koleksi'; }
  return 'Prompt';
}

  for(let i=1;i<=totalPages;i++){
    if(totalPages>7 && i!==1 && i!==totalPages && Math.abs(i-ui.page)>1){
      if(i===2 || i===totalPages-1) html += `<span style="padding:0 4px;color:var(--text-secondary)">…</span>`;
      continue;
    }
    html += `<button data-page="${i}" class="${i===ui.page?'active':''}">${i}</button>`;
  }
  html += `<button data-page="${ui.page+1}" ${ui.page>=totalPages?'disabled':''}>${ICONS.chevRight}</button>`;
  pag.innerHTML = html;
}

  p.content = v.content;
  p.updatedAt = Date.now();
  saveData(); toast('Versi dipulihkan.');
  ui.detailTab='prompt'; renderDetail();
  render();
}

/* ================================================================
   COPY / CLIPBOARD
   ================================================================ */
async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    toast('Berhasil disalin ke clipboard.');
  }catch(e){
    try{
      const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
      toast('Berhasil disalin ke clipboard.');
    }catch(e2){ toast('Gagal menyalin.'); }
  }
}
function copyPromptFilled(id){
  const p = getPromptById(id); if(!p) return;
  copyText(substituteVariables(p.content, p.variables||{}));
}

/* ================================================================
   FAVORITE / DELETE / RESTORE
   ================================================================ */
function toggleFavorite(id){
  const p = getPromptById(id); if(!p) return;
  p.favorite = !p.favorite; p.updatedAt = Date.now();
  saveData(); render();
  if(ui.detailOpen && ui.selectedId===id) renderDetail();
}
function softDelete(id){
  const p = getPromptById(id); if(!p) return;
  p.deleted = true; p.deletedAt = Date.now();
  saveData();
  if(ui.selectedId===id) closeDetail();
  render();
  toast('Prompt dipindahkan ke sampah.');
}
function restorePrompt(id){
  const p = getPromptById(id); if(!p) return;
  p.deleted = false; delete p.deletedAt;
  saveData(); render();
  toast('Prompt dipulihkan.');
}
function permanentDelete(id){
  if(!confirm('Hapus permanen prompt ini? Tindakan ini tidak bisa dibatalkan.')) return;
  prompts = prompts.filter(p=>p.id!==id);
  saveData(); render();
  toast('Prompt dihapus permanen.');
}

/* ================================================================
   MODAL: NEW / EDIT PROMPT
   ================================================================ */
function openModal(mode, id){
  modalState.mode = mode;
  modalState.editId = id || null;
  const p = id ? getPromptById(id) : null;
  modalState.selectedModels = p ? [...p.models] : [];
  modalState.selectedCategory = p ? p.categoryId : (categories[0]? categories[0].id : null);
  modalState.selectedCollections = p ? [...(p.collectionIds||[])] : [];
  modalState.selectedEmoji = p ? (p.emoji || '📄') : '📄';
  renderModal(p);
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
}
function renderModal(p){
  const box = document.getElementById('modalBox');
  box.innerHTML = `
    <div class="modal-head">
      <h3>${modalState.mode==='edit'?'Edit Prompt':'Prompt Baru'}</h3>
      <button class="icon-btn" id="btnModalClose">${ICONS.close}</button>
    </div>
    <div class="modal-body">
      <div class="field"><label>Judul</label><input type="text" id="mTitle" value="${p?esc(p.title):''}" placeholder="Judul prompt..."></div>
      <div class="field"><label>Deskripsi Singkat</label><input type="text" id="mDesc" value="${p?esc(p.description||''):''}" placeholder="Deskripsi singkat..."></div>
      <div class="field"><label>Isi Prompt</label><textarea id="mContent" placeholder="Tulis isi prompt, gunakan {{VARIABEL}} untuk bagian yang bisa diganti...">${p?esc(p.content):''}</textarea></div>
      <div class="field"><label>Tag (pisahkan dengan koma)</label><input type="text" id="mTags" value="${p?esc((p.tags||[]).join(', ')):''}" placeholder="misal: copywriting, ai-image"></div>
      <div class="field">
        <label>Model AI</label>
        <div class="chip-group" id="mModelChips">
          ${MODELS.map(m=>`<button type="button" class="chip ${modalState.selectedModels.includes(m.id)?'active':''}" data-chip-model="${m.id}">${m.name}</button>`).join('')}
        </div>
      </div>
      <div class="field">
        <label>Kategori</label>
        <select id="mCategory">
          ${categories.map(c=>`<option value="${c.id}" ${modalState.selectedCategory===c.id?'selected':''}>${c.emoji} ${esc(c.name)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Koleksi</label>
        <div class="chip-group" id="mColChips">
          ${collections.map(c=>`<button type="button" class="chip ${modalState.selectedCollections.includes(c.id)?'active':''}" data-chip-col="${c.id}">${esc(c.name)}</button>`).join('') || '<span style="font-size:12px;color:var(--text-secondary)">Belum ada koleksi.</span>'}
        </div>
      </div>
      <div class="field">
        <label>Ikon</label>
        <div class="emoji-grid" id="mEmojiGrid">
          ${EMOJI_OPTIONS.map(e=>`<button type="button" class="emoji-opt ${modalState.selectedEmoji===e?'active':''}" data-emoji="${e}">${e}</button>`).join('')}
        </div>
      </div>
      <div class="field">
        <label>Status</label>
        <select id="mStatus">
          ${['Draft','Published','Archived'].map(s=>`<option value="${s}" ${p? (p.status===s?'selected':'') : (s==='Draft'?'selected':'')}>${s}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-secondary" id="btnModalCancel">Batal</button>
      <button class="btn btn-primary" id="btnModalSave">${modalState.mode==='edit'?'Simpan Perubahan':'Buat Prompt'}</button>
    </div>
  `;
}
function saveModal(){
  const title = document.getElementById('mTitle').value.trim();
  if(!title){ toast('Judul wajib diisi.'); return; }
  const content = document.getElementById('mContent').value;
  const description = document.getElementById('mDesc').value.trim();
  const tags = document.getElementById('mTags').value.split(',').map(t=>t.trim()).filter(Boolean);
  const categoryId = document.getElementById('mCategory').value;
  const status = document.getElementById('mStatus').value;

  if(modalState.mode==='edit' && modalState.editId){
    const idx = prompts.findIndex(item => item.id === modalState.editId);
    if(idx !== -1){
      if(prompts[idx].content !== content){
        prompts[idx].versions = prompts[idx].versions || [];
        prompts[idx].versions.push({id:uid('v'), content:prompts[idx].content, note:'Sebelum diedit lewat form', createdAt:Date.now()});
      }
      prompts[idx].title = title;
      prompts[idx].description = description;
      prompts[idx].content = content;
      prompts[idx].tags = tags;
      prompts[idx].categoryId = categoryId;
      prompts[idx].status = status;
      prompts[idx].models = [...modalState.selectedModels];
      prompts[idx].collectionIds = [...modalState.selectedCollections];
      prompts[idx].emoji = modalState.selectedEmoji;
      prompts[idx].updatedAt = Date.now();
    }
    toast('Prompt diperbarui.');
  } else {
    const now = Date.now();
    prompts.unshift({
      id:uid('p'), title, description, content, models:[...modalState.selectedModels],
      categoryId, collectionIds:[...modalState.selectedCollections], tags, status,
      favorite:false, deleted:false, createdAt:now, updatedAt:now, versions:[], notes:'',
      emoji:modalState.selectedEmoji, variables:{}
    });
    toast('Prompt baru dibuat.');
  }
  saveData();
  closeModal();
  render();
}

/* ================================================================
   CATEGORY / COLLECTION MANAGEMENT
   ================================================================ */
function addCategory(){
  const name = window.prompt('Nama kategori baru:');
  if(!name || !name.trim()) return;
  categories.push({id:uid('cat'), name:name.trim(), emoji: EMOJI_OPTIONS[categories.length % EMOJI_OPTIONS.length]});
  saveData(); render();
  toast('Kategori ditambahkan.');
}
function deleteCategory(id){
  if(!confirm('Hapus kategori ini? Prompt di dalamnya tidak akan terhapus, tapi jadi tanpa kategori.')) return;
  categories = categories.filter(c=>c.id!==id);
  prompts.forEach(p=>{ if(p.categoryId===id) p.categoryId=null; });
  if(ui.nav==='cat:'+id) ui.nav='all';
  saveData(); render();
  toast('Kategori dihapus.');
}
function addCollection(){
  const name = window.prompt('Nama koleksi baru:');
  if(!name || !name.trim()) return;
  collections.push({id:uid('col'), name:name.trim()});
  saveData(); render();
  toast('Koleksi ditambahkan.');
}
function deleteCollection(id){
  if(!confirm('Hapus koleksi ini?')) return;
  collections = collections.filter(c=>c.id!==id);
  prompts.forEach(p=>{ p.collectionIds = (p.collectionIds||[]).filter(cid=>cid!==id); });
  if(ui.nav==='col:'+id) ui.nav='all';
  saveData(); render();
  toast('Koleksi dihapus.');
}

/* ================================================================
   SETTINGS PAGE ACTIONS
   ================================================================ */
function exportData(){
  const blob = new Blob([JSON.stringify({prompts,categories,collections}, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'prompt-library-data.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Data diekspor.');
}
function resetData(){
  if(!confirm('Reset semua data ke contoh awal? Data saat ini akan hilang.')) return;
  categories = defaultCategories();
  collections = defaultCollections();
  prompts = seedPrompts();
  saveData();
  ui.nav='all'; ui.page=1;
  render();
  toast('Data direset ke contoh awal.');
}

/* ================================================================
   EVENTS
   ================================================================ */
function setupEvents(){
  document.getElementById('btnCollapseSidebar').innerHTML = ICONS.collapse;
  document.getElementById('btnExpandSidebar').innerHTML = ICONS.menu;
  document.getElementById('btnHamburger').innerHTML = ICONS.menu;
  document.getElementById('btnThemeToggle').innerHTML = ui.theme==='dark'?ICONS.sun:ICONS.moon;
  document.getElementById('btnNewPrompt').innerHTML = `${ICONS.plus}<span>Prompt Baru</span>`;
  document.getElementById('btnViewGrid').innerHTML = ICONS.grid;
  document.getElementById('btnViewList').innerHTML = ICONS.list;
  document.getElementById('btnAddCategory').innerHTML = ICONS.plus;
  document.getElementById('btnAddCollection').innerHTML = ICONS.plus;
  document.getElementById('btnViewGrid').classList.toggle('active', ui.view==='grid');
  document.getElementById('btnViewList').classList.toggle('active', ui.view==='list');

  document.getElementById('btnCollapseSidebar').addEventListener('click', ()=>{
    document.getElementById('sidebar').classList.add('collapsed');
    document.getElementById('btnExpandSidebar').style.display='flex';
  });
  document.getElementById('btnExpandSidebar').addEventListener('click', ()=>{
    document.getElementById('sidebar').classList.remove('collapsed');
    document.getElementById('btnExpandSidebar').style.display='none';
  });

  document.getElementById('btnHamburger').addEventListener('click', ()=>{
    document.getElementById('sidebar').classList.add('mobile-open');
    document.getElementById('mobileBackdrop').classList.add('show');
  });
  document.getElementById('mobileBackdrop').addEventListener('click', ()=>{
    document.getElementById('sidebar').classList.remove('mobile-open');
    document.getElementById('mobileBackdrop').classList.remove('show');
  });

  document.getElementById('btnThemeToggle').addEventListener('click', toggleTheme);
  document.getElementById('btnNewPrompt').addEventListener('click', ()=>openModal('new'));

  const searchInput = document.getElementById('searchInput');
  searchInput.addEventListener('input', (e)=>{ ui.search = e.target.value; ui.page=1; renderContent(); });
  document.addEventListener('keydown', (e)=>{
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); searchInput.focus(); }
    if(e.key==='Escape'){
      if(document.getElementById('modalOverlay').classList.contains('show')) closeModal();
      else if(ui.detailOpen) closeDetail();
    }
  });

  document.getElementById('filterModel').addEventListener('change', e=>{ ui.filterModel=e.target.value; ui.page=1; renderContent(); });
  document.getElementById('filterCategory').addEventListener('change', e=>{ ui.filterCategory=e.target.value; ui.page=1; renderContent(); });
  document.getElementById('filterStatus').addEventListener('change', e=>{ ui.filterStatus=e.target.value; ui.page=1; renderContent(); });
  document.getElementById('filterSort').addEventListener('change', e=>{ ui.sort=e.target.value; ui.page=1; renderContent(); });

  document.getElementById('btnViewGrid').addEventListener('click', ()=>{ ui.view='grid'; ui.page=1; render(); });
  document.getElementById('btnViewList').addEventListener('click', ()=>{ ui.view='list'; ui.page=1; render(); });

  document.getElementById('btnAddCategory').addEventListener('click', addCategory);
  document.getElementById('btnAddCollection').addEventListener('click', addCollection);

  document.getElementById('sidebar').addEventListener('click', (e)=>{
    const navBtn = e.target.closest('[data-nav]');
    if(navBtn){
      ui.nav = navBtn.dataset.nav; ui.page=1;
      document.getElementById('sidebar').classList.remove('mobile-open');
      document.getElementById('mobileBackdrop').classList.remove('show');
      render();
      return;
    }
    const delCat = e.target.closest('[data-del-cat]');
    if(delCat){ deleteCategory(delCat.dataset.delCat); return; }
    const delCol = e.target.closest('[data-del-col]');
    if(delCol){ deleteCollection(delCol.dataset.delCol); return; }
  });

  document.getElementById('promptListWrap').addEventListener('click', (e)=>{
    const favBtn = e.target.closest('[data-fav]');
    if(favBtn){ e.stopPropagation(); toggleFavorite(favBtn.dataset.fav); return; }
    const copyBtn = e.target.closest('[data-copy]');
    if(copyBtn){ e.stopPropagation(); copyPromptFilled(copyBtn.dataset.copy); return; }
    const editBtn = e.target.closest('[data-edit]');
    if(editBtn){ e.stopPropagation(); openModal('edit', editBtn.dataset.edit); return; }
    const delBtn = e.target.closest('[data-del]');
    if(delBtn){ e.stopPropagation(); softDelete(delBtn.dataset.del); return; }
    const restoreBtn = e.target.closest('[data-restore]');
    if(restoreBtn){ e.stopPropagation(); restorePrompt(restoreBtn.dataset.restore); return; }
    const permaBtn = e.target.closest('[data-permadel]');
    if(permaBtn){ e.stopPropagation(); permanentDelete(permaBtn.dataset.permadel); return; }
    const openCard = e.target.closest('[data-open]');
    if(openCard){ openDetail(openCard.dataset.open); return; }
  });
  document.getElementById('pagination').addEventListener('click', (e)=>{
    const btn = e.target.closest('[data-page]');
    if(btn && !btn.disabled){ ui.page = parseInt(btn.dataset.page,10); renderContent(); }
  });

  document.addEventListener('click', (e)=>{
    if(e.target.id==='btnThemeToggleSettings'){ toggleTheme(); renderContent(); }
    if(e.target.id==='btnLogoutSettings'){ signOutUser(); }
    if(e.target.id==='btnExportData'){ exportData(); }
    if(e.target.id==='btnResetData'){ resetData(); }
  });

  document.getElementById('detailOverlay').addEventListener('click', closeDetail);
  document.getElementById('detailPanel').addEventListener('click', (e)=>{
    if(e.target.closest('#btnCloseDetail')){ closeDetail(); return; }
    const favBtn = e.target.closest('[data-fav]');
    if(favBtn){ toggleFavorite(favBtn.dataset.fav); return; }
    const tabBtn = e.target.closest('[data-tab]');
    if(tabBtn){ ui.detailTab = tabBtn.dataset.tab; renderDetail(); return; }
    if(e.target.closest('#btnDetailSave')){ saveDetailPrompt(); return; }
    if(e.target.closest('#btnDetailCopy')){
      const val = document.getElementById('detailContentArea').value;
      copyText(substituteVariables(val, collectVarInputs()));
      return;
    }
    if(e.target.closest('#btnPreviewCopy')){
      const p = getPromptById(ui.selectedId);
      copyText(substituteVariables(p.content, p.variables||{}));
      return;
    }
    if(e.target.closest('#btnSaveNotes')){ saveNotes(); return; }
    const restoreVerBtn = e.target.closest('[data-restore-version]');
    if(restoreVerBtn){ restoreVersion(restoreVerBtn.dataset.restoreVersion); return; }
  });

  document.getElementById('modalOverlay').addEventListener('click', (e)=>{
    if(e.target.id==='modalOverlay'){ closeModal(); return; }
    if(e.target.closest('#btnModalClose') || e.target.closest('#btnModalCancel')){ closeModal(); return; }
    if(e.target.closest('#btnModalSave')){ saveModal(); return; }
    const chipModel = e.target.closest('[data-chip-model]');
    if(chipModel){
      const id = chipModel.dataset.chipModel;
      const idx = modalState.selectedModels.indexOf(id);
      if(idx>-1) modalState.selectedModels.splice(idx,1); else modalState.selectedModels.push(id);
      chipModel.classList.toggle('active');
      return;
    }
    const chipCol = e.target.closest('[data-chip-col]');
    if(chipCol){
      const id = chipCol.dataset.chipCol;
      const idx = modalState.selectedCollections.indexOf(id);
      if(idx>-1) modalState.selectedCollections.splice(idx,1); else modalState.selectedCollections.push(id);
      chipCol.classList.toggle('active');
      return;
    }
    const emojiBtn = e.target.closest('[data-emoji]');
    if(emojiBtn){
      modalState.selectedEmoji = emojiBtn.dataset.emoji;
      document.querySelectorAll('#mEmojiGrid .emoji-opt').forEach(b=>b.classList.remove('active'));
      emojiBtn.classList.add('active');
      return;
    }
  });
}

/* ================================================================
   INIT
   ================================================================ */
function init(){
  loadTheme();
  setupEvents();
  document.getElementById('btnGoogleSignIn').addEventListener('click', signInWithGoogle);
  document.getElementById('btnLogout').addEventListener('click', signOutUser);
}
init();
</script>

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
