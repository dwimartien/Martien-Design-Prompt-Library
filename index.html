<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pos Martien Design</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" id="appFavicon">
<meta name="theme-color" content="#2D5185">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#ffffff;
  --bg-soft:#f5f7fb;
  --bg-sidebar:#fafbfd;
  --surface:#ffffff;
  --accent:#2563eb;
  --accent-dark:#1d4ed8;
  --accent-soft:#eaf1ff;
  --text:#1c2333;
  --text-secondary:#767f91;
  --border:#e7eaf1;
  --danger:#e0403f;
  --danger-soft:#fdecec;
  --success:#1f9d63;
  --success-soft:#e9f8f0;
  --warning:#b8790a;
  --warning-soft:#fdf3e2;
  --radius-lg:18px;
  --radius-md:12px;
  --radius-sm:8px;
  --shadow-card:0 1px 2px rgba(28,35,51,.04), 0 1px 8px rgba(28,35,51,.03);
  --shadow-pop:0 12px 32px rgba(28,35,51,.16);
  --sidebar-w:68px;
  --cart-w:290px;
  --header-h:0px;
}
body.dark{
  --bg:#12151d;
  --bg-soft:#181c26;
  --bg-sidebar:#0f1218;
  --surface:#1b1f29;
  --accent:#4c8bf5;
  --accent-dark:#2f6fe0;
  --accent-soft:rgba(76,139,245,.16);
  --text:#e8ebf2;
  --text-secondary:#8b93a5;
  --border:#2a2f3b;
  --danger:#f2635f;
  --danger-soft:rgba(242,99,95,.14);
  --success:#3ecf8e;
  --success-soft:rgba(62,207,142,.14);
  --warning:#f0ad4e;
  --warning-soft:rgba(240,173,78,.14);
  --shadow-card:0 1px 2px rgba(0,0,0,.3), 0 1px 10px rgba(0,0,0,.25);
  --shadow-pop:0 12px 32px rgba(0,0,0,.55);
}
body{transition:background-color .18s ease, color .18s ease;}

*{box-sizing:border-box;}
html,body{height:100%;}
/* Global fallback: setiap ICONS svg tanpa width/height eksplisit otomatis
   ikut ukuran font di sekitarnya, biar tidak pernah membesar tak terkendali
   di konteks baru manapun. Rule spesifik (.btn svg, .icon-btn svg, dst)
   tetap menang karena selector-nya lebih spesifik. */
svg{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;vertical-align:-0.125em;flex-shrink:0;}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg-soft);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--accent-soft);}

/* ---------- App shell ---------- */
#app{display:flex;min-height:100vh;}

/* Sidebar (desktop: left rail, mobile: bottom bar) */
.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--bg-sidebar);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:18px 0;
  gap:4px;
  position:fixed;
  top:0;left:0;bottom:0;
  z-index:40;
}
.sidebar .brand{
  width:34px;height:34px;border-radius:10px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;color:#fff;
  font-weight:700;font-size:15px;margin-bottom:18px;flex-shrink:0;
  letter-spacing:-0.5px;overflow:hidden;
}
.nav-item{
  width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius-sm);
  color:var(--text-secondary);
  cursor:pointer;
  background:transparent;
  border:none;
  position:relative;
  transition:background .15s ease, color .15s ease;
}
.nav-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;}
.nav-item:hover{background:var(--accent-soft);color:var(--accent);}
.nav-item.active{background:var(--accent);color:#fff;}
.nav-item .nav-label{
  display:none;
}
.sidebar-spacer{flex:1;}

/* Main content area */
#content{
  margin-left:var(--sidebar-w);
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}
.page{display:none;flex:1;min-height:100vh;flex-direction:column;}
.page.active{display:flex;}

/* Fixed "Simpan Data" button */
.btn-simpan-data{
  position:fixed;
  top:16px;right:20px;
  z-index:60;
  background:var(--accent);
  color:#fff;
  border:none;
  padding:9px 16px;
  border-radius:999px;
  font-size:13px;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:6px;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(37,99,235,.28);
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn-simpan-data:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(37,99,235,.34);}
.btn-simpan-data:active{transform:translateY(0);}
.btn-simpan-data svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2;}

.btn-theme-toggle{
  position:fixed;
  top:16px;right:150px;
  z-index:60;
  width:36px;height:36px;
  border-radius:50%;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text-secondary);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  box-shadow:var(--shadow-card);
  transition:transform .12s ease, color .12s ease;
}
.btn-theme-toggle:hover{color:var(--accent);transform:translateY(-1px);}
.btn-theme-toggle svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;}

/* ---------- Generic page header ---------- */
.page-header{
  padding:60px 28px 14px 28px;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
}
.page-header h1{font-size:20px;margin:0 0 3px 0;font-weight:700;letter-spacing:-0.2px;}
.page-header p{margin:0;color:var(--text-secondary);font-size:13px;}
.page-body{padding:0 28px 100px 28px;flex:1;}

/* ---------- Buttons ---------- */
.btn{
  border:none;border-radius:var(--radius-sm);
  padding:9px 15px;font-size:13.5px;font-weight:600;
  cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  transition:filter .12s ease, transform .08s ease;
  white-space:nowrap;
}
.btn:active{transform:scale(.98);}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{filter:brightness(1.07);}
.btn-primary:disabled{background:#c7d4ef;cursor:not-allowed;}
.btn-secondary{background:var(--bg-soft);color:var(--text);border:1px solid var(--border);}
.btn-secondary:hover{background:#eef1f6;}
.btn-ghost{background:transparent;color:var(--text-secondary);}
.btn-ghost:hover{background:var(--bg-soft);color:var(--text);}
.btn-danger{background:var(--danger-soft);color:var(--danger);}
.btn-danger:hover{filter:brightness(0.97);}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px;}
.btn-block{width:100%;justify-content:center;}
.icon-btn{
  width:32px;height:32px;border-radius:8px;border:none;background:transparent;
  color:var(--text-secondary);display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.icon-btn:hover{background:var(--bg-soft);color:var(--text);}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;}

/* ---------- Search + categories ---------- */
.search-row{
  display:flex;gap:10px;padding:0 28px 14px 28px;flex-wrap:wrap;align-items:center;
}
.search-box{
  flex:1;min-width:180px;position:relative;
}
.search-box input{
  width:100%;padding:9px 14px 9px 36px;border-radius:999px;border:1px solid var(--border);
  background:var(--bg-soft);font-size:13.5px;outline:none;color:var(--text);
}
.search-box input:focus{border-color:var(--accent);background:var(--surface);}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--text-secondary);fill:none;stroke-width:2;}

.category-row{
  display:flex;gap:8px;overflow-x:auto;padding:0 28px 16px 28px;
  scrollbar-width:none;
}
.category-row::-webkit-scrollbar{display:none;}
.pill{
  flex-shrink:0;padding:7px 15px;border-radius:999px;font-size:13px;font-weight:600;
  border:1px solid var(--border);background:var(--surface);color:var(--text-secondary);cursor:pointer;
  transition:all .12s ease;white-space:nowrap;
}
.pill:hover{border-color:var(--accent);color:var(--accent);}
.pill.active{background:var(--accent);border-color:var(--accent);color:#fff;}

/* ---------- Product grid ---------- */
.product-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px;padding:0 28px 28px 28px;
}
.combo-launch-wrap{padding:0 28px 16px 28px;}
.combo-launch-btn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 16px;border-radius:var(--radius-md);border:1.5px dashed var(--accent-border, var(--accent));
  background:var(--accent-soft);color:var(--accent-dark);font-size:13.5px;font-weight:700;cursor:pointer;
  transition:filter .12s ease, transform .08s ease;
}
.combo-launch-btn:hover{filter:brightness(0.98);}
.combo-launch-btn:active{transform:scale(.99);}
.combo-launch-icon{
  width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0;line-height:1;
}
.combo-slot{margin-bottom:10px;}
.combo-slot-label{font-size:11.5px;font-weight:600;color:var(--text-secondary);margin-bottom:5px;}
.combo-slot-filled{display:flex;align-items:center;gap:8px;}
.combo-chip{
  flex:1;min-width:0;background:var(--success-soft);border:1px solid var(--success);border-radius:10px;
  padding:8px 12px;display:flex;flex-direction:column;gap:2px;
}
.combo-chip-name{font-size:13px;font-weight:700;color:var(--text);}
.combo-chip-unit{font-size:11px;color:var(--text-secondary);}
.combo-chip-remove{flex-shrink:0;}
.combo-search-wrap{position:relative;}
.combo-search-input{
  width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:10px;font-size:13.5px;outline:none;
  background:var(--bg-soft);color:var(--text);
}
.combo-search-input:focus{border-color:var(--accent);background:var(--surface);}
.combo-search-results{
  margin-top:6px;max-height:190px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;
  background:var(--surface);
}
.combo-search-item{
  display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;
  border-bottom:1px solid var(--border);font-size:13px;
}
.combo-search-item:last-child{border-bottom:none;}
.combo-search-item:hover{background:var(--accent-soft);}
.combo-search-item-name{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.combo-search-item-price{flex-shrink:0;color:var(--text-secondary);font-size:12px;}
.combo-search-empty{padding:12px;text-align:center;font-size:12.5px;color:var(--text-secondary);}
.cart-item-combo-badge{
  display:inline-block;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:6px;
  background:var(--success-soft);color:var(--success);text-transform:uppercase;letter-spacing:.3px;margin-left:5px;vertical-align:middle;
}
.product-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:14px;cursor:pointer;transition:box-shadow .15s ease, transform .1s ease, border-color .15s ease;
  display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-card);
  position:relative;
}
.product-card:hover{box-shadow:0 4px 16px rgba(28,35,51,.09);border-color:#d7e0ee;transform:translateY(-2px);}
.product-card:active{transform:translateY(0) scale(.98);}
.product-visual{
  width:100%;aspect-ratio:1.5/1;border-radius:10px;background:var(--accent-soft);
  display:flex;align-items:center;justify-content:center;color:var(--accent);
}
.product-visual svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.6;}
.product-name{font-size:13.5px;font-weight:600;line-height:1.3;}
.product-unit-badge{font-size:11.5px;color:var(--text-secondary);}
.product-price{font-size:14.5px;font-weight:700;color:var(--accent);}
.product-card .vendor-tag{
  position:absolute;top:10px;right:10px;font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:6px;
  background:var(--warning-soft);color:var(--warning);text-transform:uppercase;letter-spacing:.3px;
}
.empty-state{
  grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--text-secondary);
}
.empty-state svg{width:40px;height:40px;stroke:var(--text-secondary);fill:none;stroke-width:1.4;margin-bottom:10px;}
.empty-state h3{margin:0 0 4px 0;color:var(--text);font-size:15px;}
.empty-state p{margin:0;font-size:13px;}

/* ---------- Buat Pesanan layout ---------- */
.pesanan-layout{display:flex;flex:1;min-width:0;}
.pesanan-main{flex:1;min-width:0;display:flex;flex-direction:column;}
.cart-panel{
  width:var(--cart-w);flex-shrink:0;border-left:1px solid var(--border);
  background:var(--surface);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.cart-panel-mobile{display:none;}
.cart-header{padding:18px 18px 10px 18px;}
.cart-header h3{margin:0;font-size:14.5px;font-weight:700;}
.cart-customer{padding:0 18px 12px 18px;display:flex;flex-direction:column;gap:8px;}
.cart-customer input{
  padding:8px 11px;border:1px solid var(--border);border-radius:9px;font-size:13px;outline:none;background:var(--bg-soft);color:var(--text);
}
.cart-customer input:focus{border-color:var(--accent);background:var(--surface);}
.cart-items{flex:1;overflow-y:auto;padding:0 18px;display:flex;flex-direction:column;}
.cart-item{
  padding:11px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:8px;
}
.cart-item:last-child{border-bottom:none;}
.cart-item-info{min-width:0;}
.cart-item-name{font-size:13px;font-weight:600;}
.cart-item-detail{font-size:11.5px;color:var(--text-secondary);margin-top:2px;}
.cart-item-right{text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.cart-item-price{font-size:13px;font-weight:700;color:var(--accent);}
.cart-item-remove{background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:11px;padding:0;}
.cart-item-remove:hover{color:var(--danger);}
.cart-empty{padding:34px 6px;text-align:center;color:var(--text-secondary);font-size:12.5px;}
.cart-empty svg{width:28px;height:28px;stroke:var(--text-secondary);fill:none;stroke-width:1.5;margin-bottom:8px;}

.cart-extra{padding:10px 18px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px;}
.cart-extra-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-secondary);}
.link-btn{background:none;border:none;color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;padding:2px 0;}
.link-btn:hover{text-decoration:underline;}

.cart-summary{padding:14px 18px 18px 18px;border-top:1px solid var(--border);}
.summary-line{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-secondary);padding:3px 0;}
.summary-line.total{font-size:16px;font-weight:800;color:var(--text);padding-top:8px;border-top:1px dashed var(--border);margin-top:6px;}
.summary-line.total .val{color:var(--accent);}

/* Mobile bottom cart bar */
.mobile-cart-bar{
  display:none;position:fixed;left:0;right:0;bottom:0;z-index:45;
  background:var(--surface);border-top:1px solid var(--border);
  padding:11px 14px;align-items:center;justify-content:space-between;gap:12px;
  box-shadow:0 -4px 18px rgba(28,35,51,.08);
}
.mobile-cart-bar .info{font-size:12.5px;color:var(--text-secondary);}
.mobile-cart-bar .total{font-size:15px;font-weight:800;color:var(--text);}
.mobile-cart-bar .total .val{color:var(--accent);}

.merge-action-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  background:var(--surface);border-top:1px solid var(--border);
  padding:11px 20px;align-items:center;justify-content:space-between;gap:12px;
  box-shadow:0 -4px 18px rgba(28,35,51,.08);
}
.merge-action-bar .info{font-size:13px;font-weight:600;color:var(--text-secondary);}
@media (max-width:860px){
  .merge-action-bar{padding:11px 14px;left:0;right:0;bottom:60px;}
}

/* Bottom sheet */
.sheet-overlay{
  position:fixed;inset:0;background:rgba(20,24,36,.4);z-index:70;
  display:none;align-items:flex-end;justify-content:center;
}
.sheet-overlay.show{display:flex;}
.sheet{
  width:100%;max-width:520px;background:var(--surface);border-radius:20px 20px 0 0;
  max-height:85vh;display:flex;flex-direction:column;
  animation:sheetUp .22s ease;
}
@keyframes sheetUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sheet-handle{width:38px;height:4px;border-radius:99px;background:var(--border);margin:10px auto 2px auto;flex-shrink:0;}

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(20,24,36,.4);z-index:80;
  display:none;align-items:center;justify-content:center;padding:16px;
}
.modal-overlay.show{display:flex;}
.modal{
  background:var(--surface);border-radius:var(--radius-lg);max-width:440px;width:100%;
  max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-pop);
  animation:modalIn .16s ease;
}
@keyframes modalIn{from{opacity:0;transform:scale(.97) translateY(6px);}to{opacity:1;transform:none;}}
.modal-head{padding:18px 20px 6px 20px;display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{margin:0;font-size:16px;font-weight:700;}
.modal-body{padding:6px 20px 20px 20px;display:flex;flex-direction:column;gap:13px;}
.modal-foot{padding:0 20px 20px 20px;display:flex;gap:8px;justify-content:flex-end;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:12.5px;font-weight:600;color:var(--text-secondary);}
.field input,.field select,.field textarea{
  padding:9px 12px;border:1px solid var(--border);border-radius:10px;font-size:13.5px;outline:none;background:var(--bg-soft);width:100%;color:var(--text);
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:var(--surface);}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.field-hint{font-size:11.5px;color:var(--text-secondary);margin-top:-2px;}
.radio-group{display:flex;gap:8px;flex-wrap:wrap;}
.radio-chip{
  border:1px solid var(--border);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;
  color:var(--text-secondary);cursor:pointer;background:var(--surface);
}
.radio-chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.calc-preview{
  background:var(--accent-soft);border-radius:10px;padding:10px 13px;font-size:13px;color:var(--accent-dark);
  display:flex;justify-content:space-between;font-weight:600;
}

/* ---------- Tables / lists ---------- */
.list-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-card);}
.list-row{
  display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border);
}
.list-row:last-child{border-bottom:none;}
.list-row:hover{background:var(--bg-soft);}
.list-avatar{
  width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;font-size:13px;
}
.list-main{flex:1;min-width:0;}
.list-title{font-size:13.5px;font-weight:700;}
.list-sub{font-size:12px;color:var(--text-secondary);margin-top:2px;}
.list-right{text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:5px;}
.list-amount{font-size:13.5px;font-weight:700;}
.badge{
  font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;text-transform:none;
}
.badge-blue{background:var(--accent-soft);color:var(--accent-dark);}
.badge-gray{background:#eef0f4;color:var(--text-secondary);}
.badge-green{background:var(--success-soft);color:var(--success);}
.badge-orange{background:var(--warning-soft);color:var(--warning);}
.badge-red{background:var(--danger-soft);color:var(--danger);}
.status-select{
  border:1px solid var(--border);border-radius:8px;font-size:11.5px;font-weight:600;padding:4px 7px;background:var(--surface);color:var(--text);
}

/* ---------- Invoice ---------- */
.invoice-wrap{max-width:680px;margin:0 auto;}
.invoice-card{background:#fff;color:#141414;border:1px solid var(--border);border-radius:var(--radius-lg);padding:38px 40px;box-shadow:var(--shadow-card);}
.pay-pill{display:inline-block;}

/* ---------- New document design (invoice + quotation), "proposal" style ---------- */
.doc-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;padding-bottom:22px;}
.doc-wordmark{font-size:25px;font-weight:900;letter-spacing:-.5px;line-height:1.1;color:#111;}
.doc-logo-img{max-height:44px;max-width:220px;width:auto;height:auto;object-fit:contain;display:block;}
.doc-contact{text-align:right;font-size:9.5px;color:#666;line-height:1.7;letter-spacing:.2px;max-width:320px;}
.doc-contact b{color:#333;}
.doc-title-row{border-top:2px solid #141414;border-bottom:1px solid #141414;padding:10px 0;margin-bottom:26px;}
.doc-title{font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:#111;}
.doc-grid{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:28px;}
.doc-grid-col{flex:1;min-width:140px;}
.doc-grid-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#111;border-bottom:1px solid #ccc;padding-bottom:7px;margin-bottom:9px;}
.doc-grid-value{font-size:13.5px;font-weight:600;color:#222;line-height:1.5;}
.doc-grid-value.muted{font-weight:400;color:#777;}
.doc-section{margin-bottom:26px;}
.doc-quote-box{background:#f0f0f0;border-radius:3px;padding:24px 26px;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
.doc-quote-title{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#111;border-bottom:1px solid #ccc;padding-bottom:9px;margin-bottom:14px;display:flex;justify-content:space-between;}
.doc-quote-row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid #ddd;}
.doc-quote-row:last-child{border-bottom:none;}
.doc-quote-item-name{font-weight:700;font-size:13px;color:#161616;}
.doc-quote-item-calc{font-size:11px;color:#777;margin-top:2px;}
.doc-quote-amount{font-weight:600;font-size:13px;color:#161616;white-space:nowrap;}
.doc-quote-subhead{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:#111;margin-top:8px;padding-top:14px;border-top:1px solid #ccc;}
.doc-quote-total-row{display:flex;justify-content:space-between;padding:9px 0;font-size:13px;}
.doc-quote-total-row.final{font-weight:800;font-size:16px;padding-top:12px;margin-top:4px;border-top:1px solid #bbb;}
.doc-badge-pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
.invoice-actions{display:flex;gap:9px;margin-top:24px;flex-wrap:wrap;}
/* ---------- Product group header ---------- */
.product-group-header{
  grid-column:1/-1;
  padding:8px 4px 6px 4px;
  font-size:11.5px;font-weight:700;
  color:var(--text-secondary);
  text-transform:uppercase;letter-spacing:.06em;
  border-bottom:1.5px solid var(--border);
  margin-bottom:2px;margin-top:10px;
}
.product-group-header:first-child{margin-top:0;}

/* ---------- Sort controls ---------- */
.sort-row{
  display:flex;gap:8px;padding:0 28px 12px 28px;align-items:center;flex-wrap:wrap;
}
.sort-label{font-size:12px;color:var(--text-secondary);font-weight:600;white-space:nowrap;}
.sort-select{
  padding:6px 10px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:12.5px;
  outline:none;cursor:pointer;
}
.sort-select:focus{border-color:var(--accent);}
.sort-dir-btn{
  width:32px;height:32px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);color:var(--text-secondary);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-size:15px;flex-shrink:0;
  transition:background .12s, color .12s;
}
.sort-dir-btn:hover{background:var(--accent-soft);color:var(--accent);}
.sort-dir-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}

.doc-sign-bank{
  display:flex;justify-content:space-between;gap:24px;
  margin-top:28px;padding-top:20px;border-top:1px dashed var(--border);
  flex-wrap:wrap;
}
.doc-sign-col,.doc-bank-col{flex:1;min-width:160px;}
.doc-sign-label{font-size:11px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
.doc-sign-space{height:56px;border-bottom:1px solid var(--border);margin-bottom:8px;width:140px;}
.doc-sign-name{font-size:12.5px;font-weight:600;color:var(--text);}
.doc-bank-line{font-size:12.5px;color:var(--text);line-height:1.8;}
.invoice-footer-note{margin-top:24px;font-size:11px;color:#999;text-align:center;}

/* ---------- Toast ---------- */
#toastRoot{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{
  background:#1c2333;color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;
  box-shadow:0 8px 24px rgba(0,0,0,.22);animation:toastIn .18s ease;display:flex;align-items:center;gap:8px;
}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* Section headers within pages */
.section-block{padding:0 28px 6px 28px;}
.section-block h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-secondary);margin:18px 0 10px 0;}

/* Settings */
.settings-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px;box-shadow:var(--shadow-card);margin-bottom:16px;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:16px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 18px;box-shadow:var(--shadow-card);}
.stat-card .stat-label{font-size:12px;color:var(--text-secondary);font-weight:600;margin-bottom:6px;}
.stat-card .stat-value{font-size:20px;font-weight:800;}
.stat-card .stat-sub{font-size:11.5px;color:var(--text-secondary);margin-top:4px;}
.top-produk-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
.top-produk-row:last-child{border-bottom:none;}
.settings-card h3{margin:0 0 3px 0;font-size:14.5px;}
.settings-card p.desc{margin:0 0 14px 0;font-size:12.5px;color:var(--text-secondary);}
.cat-manage-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);}
.cat-manage-row:last-child{border-bottom:none;}
.cat-manage-row span{flex:1;font-size:13px;font-weight:600;}

/* Filter tabs (riwayat) */
.filter-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:0 28px 14px 28px;}

@media print{
  body *{visibility:hidden;}
  #print-area, #print-area *{visibility:visible;}
  #print-area{position:absolute;left:0;top:0;width:100%;}
  .no-print{display:none!important;}
  .doc-quote-row{page-break-inside:avoid;break-inside:avoid;}
  .doc-grid, .doc-title-row{page-break-after:avoid;break-after:avoid;}
}

/* ---------- Mobile ---------- */
@media (max-width:860px){
  :root{--sidebar-w:0px;}
  .sidebar{
    width:100%;height:60px;flex-direction:row;justify-content:space-around;
    top:auto;bottom:0;left:0;right:0;border-right:none;border-top:1px solid var(--border);
    padding:6px 4px;z-index:90;
  }
  .sidebar .brand{display:none;}
  .sidebar-spacer{display:none;}
  .nav-item{width:auto;flex:1;height:48px;flex-direction:column;gap:2px;border-radius:10px;}
  .nav-item svg{width:19px;height:19px;}
  .nav-item .nav-label{display:block;font-size:9.5px;font-weight:600;}
  #content{margin-left:0;padding-bottom:64px;}
  .btn-simpan-data{top:12px;right:12px;padding:8px 13px;font-size:12px;}
  .btn-simpan-data span{display:none;}
  .btn-theme-toggle{top:12px;right:66px;width:32px;height:32px;}
  .page-header{padding:64px 16px 10px 16px;}
  .page-body{padding:0 16px 30px 16px;}
  .search-row{padding:0 16px 12px 16px;}
  .category-row{padding:0 16px 14px 16px;}
  .product-grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:0 16px 90px 16px;}
  .cart-panel{display:none;}
  .cart-panel-mobile{display:flex;flex-direction:column;width:100%;height:auto;position:static;flex:1;overflow:visible;}
  .mobile-cart-bar{display:flex;bottom:60px;z-index:44;}
  .merge-action-bar{bottom:60px;}
  .pesanan-layout{flex-direction:column;}
  .section-block{padding:0 16px 6px 16px;}
  .filter-tabs{padding:0 16px 12px 16px;}
  .invoice-wrap{padding:0;}
}
@media (min-width:861px){
  .mobile-cart-bar{display:none!important;}
  .sheet-overlay{display:none!important;}
}
</style>

<script>
/* =========================================================================
   KASIR PERCETAKAN — single-file client-side POS
   Data disimpan di localStorage (cache lokal + fallback offline) dan
   disinkronkan ke Firebase Firestore sebagai database utama.
   ========================================================================= */

/* ---------------------------- FIREBASE CONFIG ----------------------------
   Project: POS Martien Design. Login pakai akun Google, data tersimpan
   per-akun di Firestore (collection kasirPercetakan, doc = uid akun).
   ------------------------------------------------------------------------ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCd7ENEDoa2mXSMMtEs0VL4Ikh6XLjjnGE",
  authDomain: "pos-martien-design.firebaseapp.com",
  projectId: "pos-martien-design",
  storageBucket: "pos-martien-design.firebasestorage.app",
  messagingSenderId: "263293279248",
  appId: "1:263293279248:web:178b13c3a2db5644423e95"
};

const firebaseAvailable = !!(FIREBASE_CONFIG.apiKey && !String(FIREBASE_CONFIG.apiKey).startsWith('GANTI_'));
let fbDb = null;
let fbReady = false;
let fbUser = null;
let fbPushTimer = null;
let fbLastPushedJson = '';

function setSyncStatus(mode){
  // mode: 'off' | 'connecting' | 'synced' | 'error'
  window.__fbSyncStatus = mode;
  const dot = document.getElementById('fbSyncDot');
  if(dot){
    const map = {
      off:{color:'var(--text-secondary)', title:'Firebase belum dikonfigurasi — data hanya tersimpan di perangkat ini'},
      connecting:{color:'#f5a623', title:'Menghubungkan ke Firebase…'},
      synced:{color:'#2ecc71', title:'Tersinkron ke Firebase'},
      error:{color:'#e74c3c', title:'Gagal sinkron ke Firebase — memakai data lokal'}
    };
    const m = map[mode]||map.off;
    dot.style.background = m.color;
    dot.title = m.title;
  }
  if(currentPage==='pengaturan' && document.getElementById('page-pengaturan')?.classList.contains('active')){
    renderPengaturanPage();
  }
}

async function initFirebaseSync(){
  if(!firebaseAvailable){ setSyncStatus('off'); return; }
  setSyncStatus('connecting');
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    fbDb = firebase.firestore();
    firebase.auth().onAuthStateChanged(async (user)=>{
      fbUser = user;
      if(user){
        fbReady = true;
        document.getElementById('loginGate').style.display = 'none';
        document.getElementById('app').style.display = '';
        await pullStateFromFirestore();
        renderSidebar();
        goTo(currentPage);
      } else {
        fbReady = false;
        document.getElementById('app').style.display = 'none';
        document.getElementById('loginGate').style.display = 'flex';
      }
    });
  }catch(err){
    console.error('Firebase init gagal', err);
    setSyncStatus('error');
  }
}

async function signInWithGoogle(){
  try{
    const provider = new firebase.auth.GoogleAuthProvider();
    await firebase.auth().signInWithPopup(provider);
  }catch(err){
    console.error('Login Google gagal', err);
    document.getElementById('loginGateHint').textContent = 'Gagal masuk: ' + (err.message||'coba lagi.');
  }
}

async function signOutOfGoogle(){
  if(!confirm('Keluar dari akun? Data tetap aman di Firebase, akan muncul lagi saat login ulang.')) return;
  await firebase.auth().signOut();
}

function fbDocRef(){
  return fbDb.collection('kasirPercetakan').doc(fbUser.uid);
}

async function pullStateFromFirestore(){
  try{
    const snap = await fbDocRef().get();
    if(snap.exists){
      const remote = snap.data() || {};
      if(Array.isArray(remote.products)) state.products = remote.products;
      if(Array.isArray(remote.orders)) state.orders = remote.orders;
      if(Array.isArray(remote.invoices)) state.invoices = remote.invoices;
      if(Array.isArray(remote.quotations)) state.quotations = remote.quotations;
      if(remote.settings && typeof remote.settings==='object') state.settings = {...DEFAULT_SETTINGS, ...remote.settings};
      persistLocalOnly();
      fbLastPushedJson = JSON.stringify({products:state.products, orders:state.orders, invoices:state.invoices, quotations:state.quotations, settings:state.settings});
    } else {
      await pushStateToFirestore(true);
    }
    setSyncStatus('synced');
  }catch(err){
    console.error('Gagal ambil data dari Firebase', err);
    setSyncStatus('error');
  }
}

async function pushStateToFirestore(isInitialSeed){
  if(!fbReady || !fbDb) return;
  const payload = {products:state.products, orders:state.orders, invoices:state.invoices, quotations:state.quotations, settings:state.settings};
  const json = JSON.stringify(payload);
  if(!isInitialSeed && json===fbLastPushedJson) return;
  try{
    await fbDocRef().set({...payload, updatedAt: firebase.firestore.FieldValue.serverTimestamp()});
    fbLastPushedJson = json;
    setSyncStatus('synced');
  }catch(err){
    console.error('Gagal sinkron ke Firebase (cek koneksi internet/aturan Firestore)', err);
    setSyncStatus('error');
    toast('Gagal sinkron ke Firebase, data tetap aman di perangkat ini', ICONS.close);
  }
}

function schedulePushToFirestore(){
  if(!firebaseAvailable) return;
  clearTimeout(fbPushTimer);
  fbPushTimer = setTimeout(()=> pushStateToFirestore(false), 700);
}

  invoice: `<svg viewBox="0 0 24 24"><path d="M7 3h10a1 1 0 0 1 1 1v17l-3-2-2 2-2-2-2 2-2-2-1 1V4a1 1 0 0 1 1-1Z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>`,

  riwayat: `<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l4 2"/></svg>`,
  pengaturan: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>`,
  search:  `<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>`,
  cart:    `<svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 8H6"/></svg>`,

function loadState(){
  let products, orders, invoices, quotations, settings;
  try{ products = JSON.parse(localStorage.getItem('products')); }catch(e){ products=null; }
  try{ orders = JSON.parse(localStorage.getItem('orders')); }catch(e){ orders=null; }
  try{ invoices = JSON.parse(localStorage.getItem('invoices')); }catch(e){ invoices=null; }
  try{ quotations = JSON.parse(localStorage.getItem('quotations')); }catch(e){ quotations=null; }
  try{ settings = JSON.parse(localStorage.getItem('settings')); }catch(e){ settings=null; }

  if(!Array.isArray(products)){
    products = seedProducts();
  }
  if(!Array.isArray(orders)) orders = [];
  if(!Array.isArray(invoices)) invoices = [];
  if(!Array.isArray(quotations)) quotations = [];
  if(!settings || typeof settings !== 'object') settings = {...DEFAULT_SETTINGS};
  settings = {...DEFAULT_SETTINGS, ...settings};
  return {products, orders, invoices, quotations, settings};
}

/* ---------------------------- UTIL ---------------------------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function rupiah(n){
  n = Number(n)||0;
  return 'Rp' + Math.round(n).toLocaleString('id-ID');
}
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}) + ' ' + d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
}
function fmtDateShort(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
}
function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------------------------- LOGO USAHA (SVG) ---------------------------- */
function sanitizeSvg(svgText){
  return String(svgText)
    .replace(/<script[\s\S]*?<\/script>/gi, '')
    .replace(/\son\w+\s*=\s*"[^"]*"/gi, '')
    .replace(/\son\w+\s*=\s*'[^']*'/gi, '')
    .replace(/\son\w+\s*=\s*[^\s>]+/gi, '');
}
function loadImageEl(url){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=> resolve(img);
    img.onerror = reject;
    img.src = url;
  });
}
async function getLogoPngForPdf(){
  if(!state.settings.logoSvg) return null;
  try{
    const img = await loadImageEl(state.settings.logoSvg);
    const scale = 3;
    const w = img.naturalWidth || img.width || 200;
    const h = img.naturalHeight || img.height || 60;
    const canvas = document.createElement('canvas');
    canvas.width = w*scale; canvas.height = h*scale;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    return {dataUrl: canvas.toDataURL('image/png'), w, h};
  }catch(e){ console.error(e); return null; }
}

function toast(msg, icon){
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = (icon||ICONS.check) + `<span>${escapeHtml(msg)}</span>`;
  root.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .25s ease'; el.style.opacity='0'; setTimeout(()=>el.remove(),260); }, 1900);
}

function sortProducts(list, sortBy, sortDir){
  const sorted = [...list];
  if(sortBy==='name'){
    sorted.sort((a,b)=> a.nama.localeCompare(b.nama, 'id'));
  } else if(sortBy==='price'){
    sorted.sort((a,b)=> (a.harga||0)-(b.harga||0));
  }
  if(sortDir==='desc') sorted.reverse();
  return sorted;
}

function groupByKategori(list){
  const map = {};
  list.forEach(p=>{
    const k = p.kategoriTampilan||'Lainnya';
    if(!map[k]) map[k]=[];
    map[k].push(p);
  });
  return map;
}

function filteredProducts(){
  const filtered = state.products.filter(p=>{
    const matchCat = produkFilter.kategori==='Semua' || p.kategoriTampilan===produkFilter.kategori;
    const matchSearch = !produkFilter.search || p.nama.toLowerCase().includes(produkFilter.search.toLowerCase());
    return matchCat && matchSearch;
  });
  return sortProducts(filtered, produkFilter.sortBy, produkFilter.sortDir);
}

      <div class="product-visual">${UNIT_ICON[p.tipeSatuan]}</div>

      <div class="product-unit-badge">${UNIT_LABEL[p.tipeSatuan]}</div>
      <div class="product-price">${p.tipeSatuan==='jasa' ? jasaPriceSummary(p) : rupiah(p.harga)}</div>
    </div>
  `;
}

function renderProdukGrid(){
  const grid = document.getElementById('produkGrid');
  const list = filteredProducts();
  if(state.products.length===0){
    grid.innerHTML = `<div class="empty-state">${ICONS.emptyBox}<h3>Belum ada produk</h3><p>Tambahkan produk pertama untuk mulai berjualan.</p></div>`;
    return;
  }
  if(list.length===0){
    grid.innerHTML = `<div class="empty-state">${ICONS.search}<h3>Tidak ditemukan</h3><p>Coba kata kunci atau kategori lain.</p></div>`;
    return;
  }
  const showGroup = produkFilter.kategori==='Semua' && produkFilter.sortBy==='default';
  if(showGroup){
    const groups = groupByKategori(list);
    const catOrder = state.settings.categories;
    const orderedKeys = [...catOrder.filter(k=>groups[k]), ...Object.keys(groups).filter(k=>!catOrder.includes(k))];
    grid.innerHTML = orderedKeys.map(cat=>`
      <div class="product-group-header">${escapeHtml(cat)}</div>
      ${groups[cat].map(p=>produkCardHtml(p,'data-edit-product')).join('')}
    `).join('');
  } else {
    grid.innerHTML = list.map(p=>produkCardHtml(p,'data-edit-product')).join('');
  }
  grid.querySelectorAll('[data-edit-product]').forEach(card=>{
    card.addEventListener('click', ()=> openProductModal(card.dataset.editProduct));
  });
}

function jasaPriceSummary(p){
  const allHarga = (p.varianList||[]).flatMap(v=>(v.paketList||[]).map(pk=>pk.harga));
  if(allHarga.length===0) return 'Belum ada paket';
  const min = Math.min(...allHarga);
  return `Mulai ${rupiah(min)}`;
}

function unitFieldLabel(tipe){
  return {m2:'Harga per m²', m1:'Harga per meter', cm:'Harga per cm²', lembar:'Harga per Lembar', unit:'Harga per Unit', custom:'Harga Satuan', jasa:'Harga (diatur per paket)'}[tipe];
}

function openProductModal(productId){
  const editing = !!productId;
  const p = editing ? state.products.find(x=>x.id===productId) : {id:'', nama:'', tipeSatuan:'m2', harga:'', hargaMinimum:'', kategoriTampilan:state.settings.categories[0]||'', jenisProduksi:'sendiri', hargaVendor:''};
  const catOptions = state.settings.categories.map(c=>`<option value="${escapeHtml(c)}" ${p.kategoriTampilan===c?'selected':''}>${escapeHtml(c)}</option>`).join('');
  let priceUnlocked = false; // re-locks every time the modal is opened
  let askingPin = false;
  let varianListLive = editing && Array.isArray(p.varianList) ? JSON.parse(JSON.stringify(p.varianList)) : [];

  function pinGateHtml(hintText){
    return `
      <div class="field-hint">${ICONS.lock} ${hintText}</div>
      <div class="field-row">
        <div class="field"><input type="password" inputmode="numeric" id="mPinInput" placeholder="PIN" autofocus></div>
        <button type="button" class="btn btn-primary" id="mPinSubmit">${ICONS.unlock} Buka</button>
      </div>
      <div class="field-hint" id="mPinError" style="color:var(--danger);display:none">PIN salah, coba lagi.</div>
    `;
  }

  function varianRowHtml(v, vi){
    return `
      <div class="settings-card" style="padding:12px;margin-bottom:8px">
        <div class="field-row" style="align-items:flex-end">
          <div class="field"><label>Nama varian</label><input type="text" class="varianNamaInput" data-vi="${vi}" value="${escapeHtml(v.nama)}" placeholder="mis. Desain Logo"></div>
          <button type="button" class="icon-btn btnRemoveVarian" data-vi="${vi}" title="Hapus varian">${ICONS.trash}</button>
        </div>
        <div class="field-hint" style="margin-top:8px;margin-bottom:4px">Paket harga:</div>
        <div class="paketListWrap" data-vi="${vi}">
          ${v.paketList.map((pk,pi)=>`
            <div class="field-row" style="align-items:flex-end;margin-bottom:6px">
              <div class="field"><input type="text" class="paketNamaInput" data-vi="${vi}" data-pi="${pi}" value="${escapeHtml(pk.nama)}" placeholder="mis. Basic"></div>
              <div class="field"><input type="number" min="0" class="paketHargaInput" data-vi="${vi}" data-pi="${pi}" value="${pk.harga||''}" placeholder="Harga"></div>
              <button type="button" class="icon-btn btnRemovePaket" data-vi="${vi}" data-pi="${pi}">${ICONS.close}</button>
            </div>
          `).join('')}
        </div>
        <button type="button" class="btn btn-ghost btn-sm btnAddPaket" data-vi="${vi}">${ICONS.plus} Tambah Paket</button>
      </div>
    `;
  }

  function varianSectionHtml(){
    if(askingPin) return pinGateHtml('Masukkan PIN untuk mengatur varian & paket jasa.');
    if(!priceUnlocked) return `<button type="button" class="btn btn-secondary btn-sm" id="btnUnlockPrice">${ICONS.lock} Masukkan PIN untuk kelola varian & paket</button>`;
    return `
      <div class="field-hint" style="color:var(--success)">${ICONS.unlock} Kelola varian & paket jasa desain.</div>
      <div id="varianListWrap">${varianListLive.map((v,vi)=>varianRowHtml(v,vi)).join('') || '<div class="field-hint">Belum ada varian. Tambah varian dulu.</div>'}</div>
      <button type="button" class="btn btn-secondary btn-sm" id="btnAddVarian" style="margin-top:6px">${ICONS.plus} Tambah Varian Jasa</button>
    `;
  }

  function bindVarianEvents(){
    const addVarianBtn = document.getElementById('btnAddVarian');
    if(addVarianBtn) addVarianBtn.addEventListener('click', ()=>{
      varianListLive.push({id:uid(), nama:'', paketList:[{id:uid(), nama:'', harga:0}]});
      refreshPriceSection();
    });
    document.querySelectorAll('.varianNamaInput').forEach(inp=>{
      inp.addEventListener('input', ()=>{ varianListLive[+inp.dataset.vi].nama = inp.value; });
    });
    document.querySelectorAll('.btnRemoveVarian').forEach(btn=>{
      btn.addEventListener('click', ()=>{ varianListLive.splice(+btn.dataset.vi,1); refreshPriceSection(); });
    });
    document.querySelectorAll('.paketNamaInput').forEach(inp=>{
      inp.addEventListener('input', ()=>{ varianListLive[+inp.dataset.vi].paketList[+inp.dataset.pi].nama = inp.value; });
    });
    document.querySelectorAll('.paketHargaInput').forEach(inp=>{
      inp.addEventListener('input', ()=>{ varianListLive[+inp.dataset.vi].paketList[+inp.dataset.pi].harga = parseFloat(inp.value)||0; });
    });
    document.querySelectorAll('.btnRemovePaket').forEach(btn=>{
      btn.addEventListener('click', ()=>{ varianListLive[+btn.dataset.vi].paketList.splice(+btn.dataset.pi,1); refreshPriceSection(); });
    });
    document.querySelectorAll('.btnAddPaket').forEach(btn=>{
      btn.addEventListener('click', ()=>{ varianListLive[+btn.dataset.vi].paketList.push({id:uid(), nama:'', harga:0}); refreshPriceSection(); });
    });
  }

  function priceSectionHtml(tipe){
    const showMin = ['m2','m1','cm','lembar'].includes(tipe);
    const dis = priceUnlocked ? '' : 'disabled';
    const vendorField = `<div class="field" id="mVendorWrap" style="display:${jenisProduksiLive==='vendor'?'flex':'none'}">
        <label>Harga dari vendor (untuk hitung margin)</label>
        <input type="number" min="0" id="mHargaVendor" value="${p.hargaVendor||''}" placeholder="0" ${dis}>
      </div>`;
    if(askingPin){
      return `
        <div class="field-row">
          <div class="field"><label>${unitFieldLabel(tipe)}</label><input type="number" value="${p.harga}" disabled></div>
          ${showMin?`<div class="field"><label>Harga minimum</label><input type="number" value="${p.hargaMinimum||''}" disabled></div>`:''}
        </div>
        ${vendorField}
        <div class="field-hint">${ICONS.lock} Masukkan PIN untuk membuka harga produk ini.</div>
        <div class="field-row">
          <div class="field"><input type="password" inputmode="numeric" id="mPinInput" placeholder="PIN" autofocus></div>
          <button type="button" class="btn btn-primary" id="mPinSubmit">${ICONS.unlock} Buka</button>
        </div>
        <div class="field-hint" id="mPinError" style="color:var(--danger);display:none">PIN salah, coba lagi.</div>
      `;
    }
    return `
      <div class="field-row">
        <div class="field"><label id="mHargaLabel">${unitFieldLabel(tipe)}</label><input type="number" min="0" id="mHarga" value="${p.harga}" placeholder="0" ${dis}></div>
        ${showMin?`<div class="field" id="mHargaMinWrap">
          <label>Harga minimum (opsional)</label><input type="number" min="0" id="mHargaMin" value="${p.hargaMinimum||''}" placeholder="0" ${dis}>
        </div>`:''}
      </div>
      ${showMin?`<div class="field-hint">Jika hasil kalkulasi otomatis di bawah harga minimum, sistem memakai harga minimum ini.</div>`:''}
      ${vendorField}
      ${priceUnlocked
        ? `<div class="field-hint" style="color:var(--success)">${ICONS.unlock} Harga terbuka untuk diedit.</div>`
        : `<button type="button" class="btn btn-secondary btn-sm" id="btnUnlockPrice">${ICONS.lock} Masukkan PIN untuk ubah harga</button>`}
    `;
  }

  let jenisProduksiLive = p.jenisProduksi;

  openModal(`
    <div class="modal-head"><h3>${editing?'Edit Produk':'Tambah Produk'}</h3><button class="icon-btn" data-action="close-modal">${ICONS.close}</button></div>
    <div class="modal-body">
      <div class="field"><label>Nama produk</label><input type="text" id="mNama" value="${escapeHtml(p.nama)}" placeholder="mis. Banner Vinyl"></div>

      <div class="field">
        <label>Tipe satuan</label>
        <select id="mTipeSatuan">
          <option value="m2" ${p.tipeSatuan==='m2'?'selected':''}>Per Meter (m²) — input ukuran cetak (panjang × lebar)</option>
          <option value="m1" ${p.tipeSatuan==='m1'?'selected':''}>Per Meter (m¹) — input ukuran cetak (panjang saja)</option>
          <option value="cm" ${p.tipeSatuan==='cm'?'selected':''}>Per cm² — input ukuran cetak (panjang × lebar) dalam cm, untuk cutting sticker</option>
          <option value="lembar" ${p.tipeSatuan==='lembar'?'selected':''}>Per Lembar — input jumlah cetak</option>
          <option value="unit" ${p.tipeSatuan==='unit'?'selected':''}>Per Unit/Pcs — input jumlah cetak</option>
          <option value="custom" ${p.tipeSatuan==='custom'?'selected':''}>Custom/Manual — harga & biaya vendor diisi manual saat pesan (untuk borongan)</option>
          <option value="jasa" ${p.tipeSatuan==='jasa'?'selected':''}>Jasa Desain — punya varian & paket harga sendiri</option>
        </select>
      </div>

      <div class="field">
        <label>Kategori tampilan</label>
        <select id="mKategori">${catOptions || '<option value="">Belum ada kategori — buat di Pengaturan</option>'}</select>
      </div>

      <div class="field" id="mJenisProduksiWrap" style="display:${p.tipeSatuan==='jasa'?'none':'flex'}">
        <label>Jenis produksi</label>
        <div class="radio-group">
          <button type="button" class="radio-chip ${p.jenisProduksi==='sendiri'?'active':''}" data-jenis="sendiri">Produksi Sendiri</button>
          <button type="button" class="radio-chip ${p.jenisProduksi==='vendor'?'active':''}" data-jenis="vendor">Titip Cetak/Vendor</button>
        </div>
      </div>

      <div id="mPriceSection">${p.tipeSatuan==='jasa' ? varianSectionHtml() : priceSectionHtml(p.tipeSatuan)}</div>
    </div>
    <div class="modal-foot">
      ${editing?`<button class="btn btn-danger" data-action="delete-product" data-id="${p.id}" style="margin-right:auto">${ICONS.trash} Hapus</button>`:''}
      <button class="btn btn-secondary" data-action="close-modal">Batal</button>
      <button class="btn btn-primary" data-action="save-product" data-id="${p.id}">${ICONS.check} Simpan</button>
    </div>
  `);

  function refreshPriceSection(){
    const tipe = document.getElementById('mTipeSatuan').value;
    document.getElementById('mPriceSection').innerHTML = tipe==='jasa' ? varianSectionHtml() : priceSectionHtml(tipe);
    bindPriceSectionEvents();
    if(tipe==='jasa') bindVarianEvents();
  }

  function bindPriceSectionEvents(){
    const unlockBtn = document.getElementById('btnUnlockPrice');
    if(unlockBtn){
      unlockBtn.addEventListener('click', ()=>{
        askingPin = true;
        refreshPriceSection();
      });
    }
    const pinSubmit = document.getElementById('mPinSubmit');
    if(pinSubmit){
      const doSubmit = ()=>{
        const val = document.getElementById('mPinInput').value;
        if(val === state.settings.securityPin){
          askingPin = false;
          priceUnlocked = true;
          refreshPriceSection();
        } else {
          document.getElementById('mPinError').style.display = 'block';
        }
      };
      pinSubmit.addEventListener('click', doSubmit);
      document.getElementById('mPinInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') doSubmit(); });
    }
  }
  bindPriceSectionEvents();
  if(p.tipeSatuan==='jasa') bindVarianEvents();

  document.querySelectorAll('#modalBox [data-jenis]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      jenisProduksiLive = btn.dataset.jenis;
      document.querySelectorAll('#modalBox [data-jenis]').forEach(b=>b.classList.toggle('active', b===btn));
      const vw = document.getElementById('mVendorWrap');
      if(vw) vw.style.display = jenisProduksiLive==='vendor' ? 'flex':'none';
    });
  });
  document.getElementById('mTipeSatuan').addEventListener('change', (e)=>{
    const jpw = document.getElementById('mJenisProduksiWrap');
    if(jpw) jpw.style.display = e.target.value==='jasa' ? 'none' : 'flex';
    refreshPriceSection();
  });

  document.getElementById('modalBox').querySelector('[data-action="save-product"]').addEventListener('click', ()=>{
    const nama = document.getElementById('mNama').value.trim();
    const tipeSatuan = document.getElementById('mTipeSatuan').value;
    if(!nama){ toast('Nama produk wajib diisi', ICONS.close); return; }

    if(tipeSatuan==='jasa'){
      let varianToSave = p.varianList || [];
      if(priceUnlocked){
        const cleaned = varianListLive
          .map(v=>({id:v.id, nama:(v.nama||'').trim(), paketList:(v.paketList||[]).map(pk=>({id:pk.id, nama:(pk.nama||'').trim(), harga:parseFloat(pk.harga)||0})).filter(pk=>pk.nama && pk.harga>0)}))
          .filter(v=>v.nama && v.paketList.length>0);
        if(cleaned.length===0){ toast('Tambahkan minimal 1 varian dengan 1 paket (isi nama & harga)', ICONS.close); return; }
        varianToSave = cleaned;
      } else if(!editing || varianToSave.length===0){
        toast('Masukkan PIN dahulu, lalu tambahkan minimal 1 varian dengan 1 paket', ICONS.close);
        return;
      }
      const data = {
        nama, tipeSatuan,
        harga:0, hargaMinimum:0,
        kategoriTampilan: document.getElementById('mKategori').value,
        jenisProduksi:'sendiri', hargaVendor:0,
        varianList: varianToSave,
      };
      if(editing){ Object.assign(p, data); } else { state.products.push({id:uid(), ...data}); }
      persist();
      closeModal();
      renderProdukPage();
      toast(editing?'Produk diperbarui':'Produk ditambahkan');
      return;
    }

    const hargaInput = document.getElementById('mHarga');
    if(!hargaInput){ toast('Masukkan PIN dahulu untuk mengatur harga', ICONS.close); return; }
    const hargaMinInput = document.getElementById('mHargaMin');
    const hargaVendorInput = document.getElementById('mHargaVendor');
    if(!editing && hargaInput.disabled){
      toast('Masukkan PIN dahulu untuk mengatur harga produk baru', ICONS.close);
      return;
    }
    const harga = parseFloat(hargaInput.value)||0;
    if(harga<=0){ toast('Harga wajib diisi', ICONS.close); return; }
    const data = {
      nama,
      tipeSatuan,
      harga,
      hargaMinimum: hargaMinInput ? (parseFloat(hargaMinInput.value)||0) : 0,
      kategoriTampilan: document.getElementById('mKategori').value,
      jenisProduksi: jenisProduksiLive,
      hargaVendor: hargaVendorInput ? (parseFloat(hargaVendorInput.value)||0) : 0,
    };
    if(editing && hargaInput.disabled){
      // price section still locked (untouched) — keep existing price data as-is
      data.harga = p.harga; data.hargaMinimum = p.hargaMinimum; data.hargaVendor = p.hargaVendor;
    }
    if(editing){
      Object.assign(p, data);
    } else {
      state.products.push({id:uid(), ...data});
    }
    persist();
    closeModal();
    renderProdukPage();
    toast(editing?'Produk diperbarui':'Produk ditambahkan');
  });
}

document.addEventListener('click',(e)=>{
  if(e.target.closest('[data-action="close-modal"]')) closeModal();
  if(e.target.closest('[data-action="new-product"]')) openProductModal(null);
  const delBtn = e.target.closest('[data-action="delete-product"]');
  if(delBtn){
    if(confirm('Hapus produk ini? Tindakan tidak bisa dibatalkan.')){
      state.products = state.products.filter(p=>p.id!==delBtn.dataset.id);
      persist();
      closeModal();
      renderProdukPage();
      toast('Produk dihapus');
    }
  }
});

/* ================================================================
   BUAT PESANAN PAGE (cart / draft order)
   ================================================================ */
let cart = newCartDraft();

function newCartDraft(){
  return {
    customer:{nama:'', noWA:''},
    namaPesanan:'',
    items:[], // {id, produkId, nama, tipeSatuan, detail, subtotal}
    biayaTambahan:[], // {id, nama, nominal}
    diskon:{tipe:'nominal', nilai:0}, // tipe: nominal|persen
  };
}

function orderDisplayTitle(order){
  // Nama Pesanan · Customer (fallback ke nama customer saja kalau namaPesanan kosong)
  const np = (order.namaPesanan||'').trim();
  const cust = order.customer.nama||'';
  return np ? `${escapeHtml(np)} &middot; ${escapeHtml(cust)}` : escapeHtml(cust);
}
function cartSubtotalItems(){ return cart.items.reduce((s,i)=>s+i.subtotal,0); }
function cartBiayaTambahan(){ return cart.biayaTambahan.reduce((s,b)=>s+b.nominal,0); }
function cartDiskonNominal(){
  const base = cartSubtotalItems()+cartBiayaTambahan();
  if(cart.diskon.tipe==='persen') return base * (cart.diskon.nilai/100);
  return cart.diskon.nilai||0;
}
function cartTotal(){
  const t = cartSubtotalItems()+cartBiayaTambahan()-cartDiskonNominal();
  return Math.max(0, t);
}

  el.querySelectorAll('[data-pesanan-cat]').forEach(b=>{
    b.addEventListener('click', ()=>{ pesananFilter.kategori = b.dataset.pesananCat; renderPesananPage(); });
  });
  document.getElementById('btnOpenCartSheet').addEventListener('click', openCartSheet);

function filteredPesananProducts(){
  const filtered = state.products.filter(p=>{
    const matchCat = pesananFilter.kategori==='Semua' || p.kategoriTampilan===pesananFilter.kategori;
    const matchSearch = !pesananFilter.search || p.nama.toLowerCase().includes(pesananFilter.search.toLowerCase());
    return matchCat && matchSearch;
  });
  return sortProducts(filtered, pesananFilter.sortBy, pesananFilter.sortDir);
}

function renderPesananGrid(){
  const grid = document.getElementById('pesananGrid');
  const list = filteredPesananProducts();
  if(state.products.length===0){
    grid.innerHTML = `<div class="empty-state">${ICONS.emptyBox}<h3>Belum ada produk</h3><p>Tambahkan produk dulu di menu Produk.</p></div>`;
    return;
  }
  if(list.length===0){
    grid.innerHTML = `<div class="empty-state">${ICONS.search}<h3>Tidak ditemukan</h3><p>Coba kata kunci atau kategori lain.</p></div>`;
    return;
  }
  const showGroup = pesananFilter.kategori==='Semua' && pesananFilter.sortBy==='default';
  if(showGroup){
    const groups = groupByKategori(list);
    const catOrder = state.settings.categories;

  }
  grid.querySelectorAll('[data-pick-product]').forEach(card=>{
    card.addEventListener('click', ()=> openPickProductModal(card.dataset.pickProduct));
  });
}

function calcSubtotalForType(p, vals){
  const harga = (p.tipeSatuan==='custom' && vals.hargaManual!==undefined) ? (parseFloat(vals.hargaManual)||0) : (p.harga||0);
  const hargaMinimum = p.hargaMinimum||0;
  let raw = 0, detail = {}, calcText='';
  if(p.tipeSatuan==='m2'){
    const panjang = parseFloat(vals.panjang)||0, lebar = parseFloat(vals.lebar)||0;
    raw = panjang*lebar*harga;
    detail = {panjang, lebar};
    calcText = `${panjang}m x ${lebar}m = ${(panjang*lebar).toLocaleString('id-ID')}m² x ${rupiah(harga)}`;
  } else if(p.tipeSatuan==='m1'){
    const panjang = parseFloat(vals.panjang)||0;
    raw = panjang*harga;
    detail = {panjang};
    calcText = `${panjang}m x ${rupiah(harga)}`;
  } else if(p.tipeSatuan==='cm'){
    const panjangCm = parseFloat(vals.panjangCm)||0, lebarCm = parseFloat(vals.lebarCm)||0;
    raw = panjangCm*lebarCm*harga;
    detail = {panjangCm, lebarCm};
    calcText = `${panjangCm}cm x ${lebarCm}cm = ${(panjangCm*lebarCm).toLocaleString('id-ID')}cm² x ${rupiah(harga)}`;
  } else if(p.tipeSatuan==='lembar'){
    const jumlah = parseFloat(vals.jumlah)||0;
    raw = jumlah*harga;
    detail = {jumlahLembar:jumlah};
    calcText = `${jumlah} lembar x ${rupiah(harga)}`;
  } else if(p.tipeSatuan==='unit'){
    const jumlah = parseFloat(vals.jumlah)||0;
    raw = jumlah*harga;
    detail = {jumlah};
    calcText = `${jumlah} unit x ${rupiah(harga)}`;
  } else { // custom
    const jumlah = parseFloat(vals.jumlah)||1;
    raw = jumlah*harga;
    detail = {jumlah};
    calcText = jumlah>1 ? `${jumlah} x ${rupiah(harga)} (harga manual)` : `${rupiah(harga)} (harga manual)`;
  }
  let subtotal = raw;
  let minApplied = false;
  if(['m2','m1','cm','lembar'].includes(p.tipeSatuan) && hargaMinimum>0 && raw>0 && raw<hargaMinimum){
    subtotal = hargaMinimum;
    minApplied = true;
  }
  return {subtotal, detail, calcText, minApplied, raw};
}

/* ---------------------------- KOMBINASI PRODUK (merge item saat input pesanan) ---------------------------- */
const COMBO_ALLOWED_UNITS = ['m2','m1','cm','lembar','unit'];

function comboUnitDetailKeys(tipe){
  return {m2:['panjang','lebar'], m1:['panjang'], cm:['panjangCm','lebarCm'], lembar:['jumlahLembar'], unit:['jumlah']}[tipe] || [];
}

// Hitung subtotal 1 komponen produk dalam kombinasi, dari shared detail (ukuran/qty yang sama untuk semua komponen).
function calcComponentAmount(p, detail){
  const harga = p.harga||0;
  let raw = 0;
  if(p.tipeSatuan==='m2') raw = (parseFloat(detail.panjang)||0)*(parseFloat(detail.lebar)||0)*harga;
  else if(p.tipeSatuan==='m1') raw = (parseFloat(detail.panjang)||0)*harga;
  else if(p.tipeSatuan==='cm') raw = (parseFloat(detail.panjangCm)||0)*(parseFloat(detail.lebarCm)||0)*harga;
  else if(p.tipeSatuan==='lembar') raw = (parseFloat(detail.jumlahLembar)||0)*harga;
  else if(p.tipeSatuan==='unit') raw = (parseFloat(detail.jumlah)||0)*harga;
  let subtotal = raw, minApplied = false;
  const hargaMinimum = p.hargaMinimum||0;
  if(['m2','m1','cm','lembar'].includes(p.tipeSatuan) && hargaMinimum>0 && raw>0 && raw<hargaMinimum){
    subtotal = hargaMinimum; minApplied = true;
  }
  return {raw, subtotal, minApplied};
}

// Hitung biaya vendor 1 komponen (untuk margin), tanpa aturan harga minimum (sama seperti itemVendorCost item tunggal).
function calcComponentVendorCost(p, detail){
  if(p.jenisProduksi!=='vendor') return null;
  const hv = p.hargaVendor||0;
  if(p.tipeSatuan==='m2') return (parseFloat(detail.panjang)||0)*(parseFloat(detail.lebar)||0)*hv;
  if(p.tipeSatuan==='m1') return (parseFloat(detail.panjang)||0)*hv;
  if(p.tipeSatuan==='cm') return (parseFloat(detail.panjangCm)||0)*(parseFloat(detail.lebarCm)||0)*hv;
  if(p.tipeSatuan==='lembar') return (parseFloat(detail.jumlahLembar)||0)*hv;
  if(p.tipeSatuan==='unit') return (parseFloat(detail.jumlah)||0)*hv;
  return null;
}

function comboComponentUnitInputsHtml(tipe){
  if(tipe==='m2'){
    return `<div class="field-row">
      <div class="field"><label>Panjang (m)</label><input type="number" min="0" step="0.01" id="comboPanjang" placeholder="0"></div>
      <div class="field"><label>Lebar (m)</label><input type="number" min="0" step="0.01" id="comboLebar" placeholder="0"></div>
    </div>`;
  }
  if(tipe==='m1') return `<div class="field"><label>Panjang (m)</label><input type="number" min="0" step="0.01" id="comboPanjang" placeholder="0"></div>`;
  if(tipe==='cm'){
    return `<div class="field-row">
      <div class="field"><label>Panjang (cm)</label><input type="number" min="0" step="0.1" id="comboPanjangCm" placeholder="0"></div>
      <div class="field"><label>Lebar (cm)</label><input type="number" min="0" step="0.1" id="comboLebarCm" placeholder="0"></div>
    </div>`;
  }
  if(tipe==='lembar') return `<div class="field"><label>Jumlah lembar</label><input type="number" min="0" step="1" id="comboJumlahLembar" placeholder="0"></div>`;
  if(tipe==='unit') return `<div class="field"><label>Jumlah</label><input type="number" min="0" step="1" id="comboJumlah" placeholder="0"></div>`;
  return '';
}

function readComboDetailFromDom(){
  const detail = {};
  const map = {comboPanjang:'panjang', comboLebar:'lebar', comboPanjangCm:'panjangCm', comboLebarCm:'lebarCm', comboJumlahLembar:'jumlahLembar', comboJumlah:'jumlah'};
  Object.keys(map).forEach(elId=>{
    const el = document.getElementById(elId);
    if(el) detail[map[elId]] = el.value;
  });
  return detail;
}

function openKombinasiModal(editingItemId){
  const editingItem = editingItemId ? cart.items.find(i=>i.id===editingItemId) : null;
  // comboState.components: [{produkId, nama, tipeSatuan, harga, hargaMinimum, jenisProduksi, hargaVendor}]
  let comboState = { components: [] };
  let nameManuallyEdited = false;
  let searchText = '';

  if(editingItem && editingItem.isCombo){
    comboState.components = editingItem.comboComponents.map(c=>({...c}));
    nameManuallyEdited = true; // keep existing custom name by default when editing
  }

  openModal(`
    <div class="modal-head"><h3>${editingItem?'Edit':'Buat'} Kombinasi Produk</h3><button class="icon-btn" data-action="close-modal">${ICONS.close}</button></div>
    <div class="modal-body">
      <div class="field-hint">Pilih minimal 2 produk untuk digabung jadi 1 baris pesanan. Ukuran/jumlah cukup diisi sekali, berlaku untuk semua produk.</div>
      <div id="comboSlots"></div>
      <div id="comboUnitInputs"></div>
      <div class="field"><label>Nama tampilan</label><input type="text" id="comboNama" placeholder="Otomatis dari nama produk yang dipilih"></div>
      <div class="field"><label>Keterangan item (opsional)</label><input type="text" id="comboKeterangan" placeholder="mis. Ambulance, Logo Perusahaan"></div>
      <div class="calc-preview"><span>Subtotal</span><span id="comboPreview">Rp0</span></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-secondary" data-action="close-modal">Batal</button>
      <button class="btn btn-primary" id="btnAddCombo">${ICONS.plus} ${editingItem?'Simpan Perubahan':'Tambah ke Pesanan'}</button>
    </div>
  `);

  const namaInput = document.getElementById('comboNama');
  if(editingItem) namaInput.value = editingItem.nama;
  namaInput.addEventListener('input', ()=>{ nameManuallyEdited = true; });
  const ketInput = document.getElementById('comboKeterangan');
  if(editingItem) ketInput.value = editingItem.keterangan||'';

  function autoName(){
    if(nameManuallyEdited) return;
    namaInput.value = comboState.components.map(c=>c.nama).join(' + ');
  }

  function currentUnit(){ return comboState.components.length>0 ? comboState.components[0].tipeSatuan : null; }

  function matchingProducts(query){
    const unit = currentUnit();
    const chosenIds = new Set(comboState.components.map(c=>c.produkId));
    return state.products.filter(p=>{
      if(chosenIds.has(p.id)) return false;
      if(!COMBO_ALLOWED_UNITS.includes(p.tipeSatuan)) return false;
      if(unit && p.tipeSatuan!==unit) return false;
      if(query && !p.nama.toLowerCase().includes(query.toLowerCase())) return false;
      return true;
    }).slice(0,8);
  }

  function addComponent(p){
    comboState.components.push({
      produkId:p.id, nama:p.nama, tipeSatuan:p.tipeSatuan, harga:p.harga||0, hargaMinimum:p.hargaMinimum||0,
      jenisProduksi:p.jenisProduksi||'sendiri', hargaVendor:p.jenisProduksi==='vendor'?(p.hargaVendor||0):0
    });
    searchText = '';
    autoName();
    renderAll();
  }

  function removeComponent(idx){
    comboState.components.splice(idx,1);
    autoName();
    renderAll();
  }

  function renderSlots(){
    const wrap = document.getElementById('comboSlots');
    const filledHtml = comboState.components.map((c,idx)=>`
      <div class="combo-slot combo-slot-filled">
        <div class="combo-slot-label">Produk ${idx+1}</div>
        <div class="combo-chip">
          <span class="combo-chip-name">${escapeHtml(c.nama)}</span>
          <span class="combo-chip-unit">${UNIT_LABEL[c.tipeSatuan]} &middot; ${rupiah(c.harga)}${c.hargaMinimum>0?` &middot; Min. ${rupiah(c.hargaMinimum)}`:''}</span>
        </div>
        <button type="button" class="icon-btn combo-chip-remove" data-combo-remove="${idx}">${ICONS.close}</button>
      </div>
    `).join('');
    const nextIdx = comboState.components.length;
    const results = matchingProducts(searchText);
    const emptySlotHtml = `
      <div class="combo-slot">
        <div class="combo-slot-label">Produk ${nextIdx+1}${nextIdx<1?'':' (opsional)'}</div>
        <div class="combo-search-wrap">
          <input type="text" class="combo-search-input" id="comboSearchInput" placeholder="Cari produk..." autocomplete="off" value="${escapeHtml(searchText)}">
          <div class="combo-search-results">
            ${results.length===0 ? `<div class="combo-search-empty">${searchText?'Tidak ditemukan':(currentUnit()?`Tidak ada produk lain dengan satuan ${UNIT_LABEL[currentUnit()]}`:'Ketik untuk mencari produk')}</div>` :
              results.map(p=>`
                <div class="combo-search-item" data-combo-pick="${p.id}">
                  <span class="combo-search-item-name">${escapeHtml(p.nama)}</span>
                  <span class="combo-search-item-price">${rupiah(p.harga)}</span>
                </div>
              `).join('')}
          </div>
        </div>
      </div>
    `;
    wrap.innerHTML = filledHtml + emptySlotHtml;

    wrap.querySelectorAll('[data-combo-remove]').forEach(btn=>{
      btn.addEventListener('click', ()=> removeComponent(parseInt(btn.dataset.comboRemove,10)));
    });
    wrap.querySelectorAll('[data-combo-pick]').forEach(row=>{
      row.addEventListener('click', ()=>{
        const p = state.products.find(x=>x.id===row.dataset.comboPick);
        if(p) addComponent(p);
      });
    });
    const searchInput = document.getElementById('comboSearchInput');
    searchInput.addEventListener('input', (e)=>{ searchText = e.target.value; renderSlots(); });
    searchInput.focus();
    if(searchText) searchInput.setSelectionRange(searchText.length, searchText.length);
  }

  function renderUnitInputs(){
    const wrap = document.getElementById('comboUnitInputs');
    const unit = currentUnit();
    if(!unit || comboState.components.length===0){ wrap.innerHTML=''; return; }
    wrap.innerHTML = comboComponentUnitInputsHtml(unit);
    if(editingItem && editingItem.detail){
      Object.keys(editingItem.detail).forEach(k=>{
        const idMap = {panjang:'comboPanjang', lebar:'comboLebar', panjangCm:'comboPanjangCm', lebarCm:'comboLebarCm', jumlahLembar:'comboJumlahLembar', jumlah:'comboJumlah'};
        const el = document.getElementById(idMap[k]);
        if(el) el.value = editingItem.detail[k];
      });
    }
    wrap.querySelectorAll('input').forEach(inp=> inp.addEventListener('input', updatePreview));
  }

  function updatePreview(){
    const detail = readComboDetailFromDom();
    const total = comboState.components.reduce((s,c)=> s + calcComponentAmount(c, detail).subtotal, 0);
    document.getElementById('comboPreview').textContent = rupiah(total);
  }

  function renderAll(){
    renderSlots();
    renderUnitInputs();
    updatePreview();
  }

  renderAll();
  if(editingItem) updatePreview();

  document.getElementById('btnAddCombo').addEventListener('click', ()=>{
    if(comboState.components.length<2){ toast('Pilih minimal 2 produk untuk kombinasi', ICONS.close); return; }
    const detail = readComboDetailFromDom();
    const unit = currentUnit();
    const keys = comboUnitDetailKeys(unit);
    const hasValue = keys.some(k=> (parseFloat(detail[k])||0) > 0);
    if(!hasValue){ toast('Isi ukuran/jumlah dengan benar', ICONS.close); return; }

    const parts = comboState.components.map(c=>{
      const amt = calcComponentAmount(c, detail);
      const vendorCost = calcComponentVendorCost(c, detail);
      return {
        produkId:c.produkId, nama:c.nama, tipeSatuan:c.tipeSatuan, harga:c.harga, hargaMinimum:c.hargaMinimum,
        jenisProduksi:c.jenisProduksi, hargaVendor:c.hargaVendor,
        subtotal:amt.subtotal, raw:amt.raw, minApplied:amt.minApplied, vendorCost
      };
    });
    const subtotal = parts.reduce((s,c)=>s+c.subtotal, 0);
    const minApplied = parts.some(c=>c.minApplied);
    const namaFinal = (namaInput.value||'').trim() || comboState.components.map(c=>c.nama).join(' + ');
    const keterangan = (ketInput.value||'').trim();

    // sanitize detail to numeric values matching unit keys
    const cleanDetail = {};
    keys.forEach(k=>{ cleanDetail[k] = parseFloat(detail[k])||0; });

    if(editingItem){
      editingItem.nama = namaFinal;
      editingItem.keterangan = keterangan;
      editingItem.tipeSatuan = unit;
      editingItem.detail = cleanDetail;
      editingItem.subtotal = subtotal;
      editingItem.calcText = 'Kombinasi produk';
      editingItem.minApplied = minApplied;
      editingItem.isCombo = true;
      editingItem.comboComponents = parts;
      editingItem.jenisProduksiSaatItu = 'sendiri';
      editingItem.hargaVendorSaatItu = null;
      editingItem.hargaSaatItu = null;
    } else {
      cart.items.push({
        id:uid(), produkId:null, nama:namaFinal, keterangan, tipeSatuan:unit, detail:cleanDetail,
        subtotal, hargaSaatItu:null, calcText:'Kombinasi produk', minApplied,
        jenisProduksiSaatItu:'sendiri', hargaVendorSaatItu:null,
        isCombo:true, comboComponents:parts
      });
    }
    closeModal();
    refreshCartViews();
    toast(editingItem?'Kombinasi diperbarui':'Kombinasi produk ditambahkan');
  });
}

    if(qLebar) vals.lebar = qLebar.value;
    if(qPanjangCm) vals.panjangCm = qPanjangCm.value;
    if(qLebarCm) vals.lebarCm = qLebarCm.value;
    if(qJumlah) vals.jumlah = qJumlah.value;
    if(qHargaManual) vals.hargaManual = qHargaManual.value;
    if(qVendorManual) vals.vendorManual = qVendorManual.value;
    return vals;
  }
  function updatePreview(){
    const {subtotal} = calcSubtotalForType(p, readVals());
    document.getElementById('qPreview').textContent = rupiah(subtotal);
  }
  inputs.forEach(inp=> inp.addEventListener('input', updatePreview));
  updatePreview();

  document.getElementById('btnAddToCart').addEventListener('click', ()=>{
    const vals = readVals();
    const {subtotal, detail, raw, calcText, minApplied} = calcSubtotalForType(p, vals);
    if(raw<=0){ toast('Isi ukuran/jumlah dengan benar', ICONS.close); return; }
    const keterangan = (document.getElementById('qKeterangan').value||'').trim();
    const isCustom = p.tipeSatuan==='custom';
    const vendorManualVal = isCustom ? (parseFloat(vals.vendorManual)||0) : 0;
    cart.items.push({
      id:uid(), produkId:p.id, nama:p.nama, keterangan, tipeSatuan:p.tipeSatuan, detail, subtotal,
      hargaSaatItu: isCustom ? (parseFloat(vals.hargaManual)||0) : p.harga, calcText, minApplied,
      jenisProduksiSaatItu: isCustom ? (vendorManualVal>0 ? 'vendor' : 'sendiri') : p.jenisProduksi,
      hargaVendorSaatItu: isCustom ? (vendorManualVal>0 ? vendorManualVal : null) : (p.jenisProduksi==='vendor' ? (p.hargaVendor||0) : null),
    });
    closeModal();

    toast(`${p.nama} ditambahkan`);
  });
}

function itemDisplayName(item){
  const ket = (item.keterangan||'').trim();
  return ket ? `${escapeHtml(item.nama)} — ${escapeHtml(ket)}` : escapeHtml(item.nama);
}
function itemDisplayNamePlain(item){
  const ket = (item.keterangan||'').trim();
  return ket ? `${item.nama} — ${ket}` : item.nama;
}
function itemDetailText(item){
  if(item.tipeSatuan==='m2') return `${item.detail.panjang}m x ${item.detail.lebar}m`;
  if(item.tipeSatuan==='m1') return `${item.detail.panjang}m`;
  if(item.tipeSatuan==='cm') return `${item.detail.panjangCm}cm x ${item.detail.lebarCm}cm`;
  if(item.tipeSatuan==='lembar') return `${item.detail.jumlahLembar} lembar`;
  if(item.tipeSatuan==='unit') return `${item.detail.jumlah} unit`;
  if(item.tipeSatuan==='jasa') return `${item.detail.varianNama} — ${item.detail.paketNama}${item.detail.jumlah>1?` x${item.detail.jumlah}`:''}`;
  return item.detail.jumlah>1 ? `${item.detail.jumlah}x` : `1x`;
}

/* ---------------------------- MARGIN (produk titip vendor saja) ---------------------------- */
function itemVendorCost(item){
  if(item.isCombo){
    const costs = (item.comboComponents||[]).map(c=>c.vendorCost).filter(v=>v!==null && v!==undefined);
    if(costs.length===0) return null;
    return costs.reduce((s,v)=>s+v,0);
  }
  if(item.hargaVendorSaatItu===null || item.hargaVendorSaatItu===undefined) return null;
  const hv = item.hargaVendorSaatItu;
  if(item.tipeSatuan==='m2') return (item.detail.panjang||0)*(item.detail.lebar||0)*hv;
  if(item.tipeSatuan==='m1') return (item.detail.panjang||0)*hv;
  if(item.tipeSatuan==='cm') return (item.detail.panjangCm||0)*(item.detail.lebarCm||0)*hv;
  if(item.tipeSatuan==='lembar') return (item.detail.jumlahLembar||0)*hv;
  if(item.tipeSatuan==='unit') return (item.detail.jumlah||0)*hv;
  return (item.detail.jumlah||1)*hv; // custom
}
function itemMargin(item){
  const cost = itemVendorCost(item);
  if(cost===null) return null;
  return item.subtotal - cost;
}
function orderMarginInfo(order){
  let total = 0, hasVendorItem = false, hasNonVendorItem = false;
  (order.items||[]).forEach(item=>{
    const m = itemMargin(item);
    if(m===null){ hasNonVendorItem = true; }
    else { hasVendorItem = true; total += m; }
  });
  return {total, hasVendorItem, hasNonVendorItem};
}

function convertQuotationToInvoice(quotation){

  const order = {

    customer: {...quotation.customer},
    namaPesanan: quotation.namaPesanan||'',

    statusPembayaran: 'Belum Bayar',
    nominalDP: 0,
    total: quotation.total,
    tanggal: new Date().toISOString(),
    mergedInto: null,
  };
  state.orders.push(order);
  const invoice = {
    id: uid(),
    nomorInvoice: state.settings.nextInvoiceNumber,
    orderId: order.id,
    isMerged: false,
    tanggal: new Date().toISOString(),
  };

  state.settings.nextInvoiceNumber += 1;
  quotation.status = 'Dikonversi';
  quotation.convertedInvoiceId = invoice.id;
  persist();
  currentInvoiceId = invoice.id;
  goTo('invoice', {invoiceId: invoice.id});
  toast('Quotation dikonversi menjadi invoice');
