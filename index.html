function getInvoiceOrders(invoice){
  if(!invoice) return [];
  if(invoice.isMerged) return (invoice.orderIds||[]).map(id=>state.orders.find(o=>o.id===id)).filter(Boolean);
  const o = state.orders.find(x=>x.id===invoice.orderId);
  return o ? [o] : [];
}

/* ---------------------------- ANALYTICS HELPERS (Dashboard/Pelanggan/Piutang) ---------------------------- */
function allInvoiceRows(){
  return state.invoices.map(inv=>{
    const orders = getInvoiceOrders(inv);
    const payment = getInvoicePayment(inv, orders);
    const customer = orders[0] ? orders[0].customer : {nama:'-', noWA:''};
    return {invoice:inv, orders, payment, customer};
  }).filter(r=>r.orders.length>0);
}

function sisaTagihanOf(payment){
  if(payment.statusPembayaran==='DP') return Math.max(0, (payment.total||0)-(payment.nominalDP||0));
  if(payment.statusPembayaran==='Belum Bayar') return payment.total||0;
  return 0;
}

function computeDashboardStats(){
  const rows = allInvoiceRows();
  const now = new Date();
  const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const startOfWeek = new Date(startOfDay); startOfWeek.setDate(startOfDay.getDate()-startOfDay.getDay());
  const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);

  let omzetHariIni=0, omzetMingguIni=0, omzetBulanIni=0, totalPiutang=0, jumlahPiutang=0, totalMargin=0;
  const produkTally = {};
  rows.forEach(r=>{
    const d = new Date(r.invoice.tanggal);
    const total = r.payment.total||0;
    if(d>=startOfDay) omzetHariIni+=total;
    if(d>=startOfWeek) omzetMingguIni+=total;
    if(d>=startOfMonth) omzetBulanIni+=total;
    const sisa = sisaTagihanOf(r.payment);
    if(sisa>0){ totalPiutang+=sisa; jumlahPiutang+=1; }
    r.orders.forEach(o=>{
      totalMargin += orderMarginInfo(o).total;
      o.items.forEach(item=>{
        const key = item.nama;
        if(!produkTally[key]) produkTally[key] = {nama:item.nama, qty:0, omzet:0};
        const qty = (item.detail && item.detail.jumlah) ? item.detail.jumlah : 1;
        produkTally[key].qty += qty;
        produkTally[key].omzet += item.subtotal;
      });
    });
  });
  const topProduk = Object.values(produkTally).sort((a,b)=>b.omzet-a.omzet).slice(0,5);
  return {omzetHariIni, omzetMingguIni, omzetBulanIni, totalPiutang, jumlahPiutang, totalMargin, topProduk, totalInvoice: rows.length};
}

function computeCustomerList(){
  const map = {};
  state.orders.forEach(o=>{
    const key = (o.customer.noWA||'').trim() || `nama:${(o.customer.nama||'').trim().toLowerCase()}`;
    if(!key.replace('nama:','').trim()) return;
    if(!map[key]) map[key] = {nama:o.customer.nama, noWA:o.customer.noWA, totalOrder:0, totalOmzet:0, lastTanggal:o.tanggal, orders:[]};
    map[key].totalOrder += 1;
    map[key].totalOmzet += o.total||0;
    map[key].orders.push(o);
    if(new Date(o.tanggal) > new Date(map[key].lastTanggal)) map[key].lastTanggal = o.tanggal;
    // keep most recently seen name/WA as the display one
    if(new Date(o.tanggal) >= new Date(map[key].lastTanggal)){ map[key].nama = o.customer.nama; map[key].noWA = o.customer.noWA; }
  });
  return Object.values(map).sort((a,b)=> new Date(b.lastTanggal)-new Date(a.lastTanggal));
}

function getOrderInvoice(order){
  if(order.mergedInto) return state.invoices.find(i=>i.id===order.mergedInto) || null;
  return state.invoices.find(i=>!i.isMerged && i.orderId===order.id) || null;
}
function getInvoicePayment(invoice, orders){
  if(invoice.isMerged){
    return {statusPembayaran: invoice.statusPembayaran, nominalDP: invoice.nominalDP||0, total: invoice.total};
  }
  const o = orders[0];
  return {statusPembayaran: o?o.statusPembayaran:'Belum Bayar', nominalDP: o?(o.nominalDP||0):0, total: o?o.total:0};
}

function itemInvoiceCalcLine(item){
  const dimText = itemDetailText(item);
  if(item.minApplied) return `${dimText} (di bawah minimum, dikenakan harga minimum)`;
  return dimText;
}

  if(state.settings.alamat) contactParts.push(escapeHtml(state.settings.alamat));
  if(state.settings.noWA) contactParts.push(`WA ${escapeHtml(state.settings.noWA)}`);
  return `
    <div class="doc-header">
      <div>

        ${showNameText?`<div class="doc-wordmark">${escapeHtml(state.settings.namaUsaha||'Percetakan')}</div>`:''}
      </div>
      <div class="doc-contact">${contactParts.join('<br>')}</div>

}

    const diskonNominal = order.diskon && order.diskon.nilai>0

    subtotalItemsAll += subtotalItems; biayaTotalAll += biayaTotal; diskonNominalAll += diskonNominal;

              <div class="doc-grid-label">Pesanan</div>

            </div>
            <div class="doc-grid-col">
              <div class="doc-grid-label">No. Invoice</div>
              <div class="doc-grid-value">INV-${String(invoice.nomorInvoice).padStart(4,'0')}</div>
              <div class="doc-grid-value muted" style="font-size:12px;margin-top:2px">${fmtDate(invoice.tanggal)}</div>
            </div>
            <div class="doc-grid-col">
              <div class="doc-grid-label">Status</div>
              <div class="doc-grid-value"><span class="badge ${payBadge} doc-badge-pill">${payment.statusPembayaran}</span>
                <button class="icon-btn no-print" id="btnEditPayment" style="margin-left:4px" title="Ubah status pembayaran">${ICONS.edit}</button>

              <div class="doc-grid-value muted" style="font-size:12px;margin-top:2px">${escapeHtml(customer.noWA)}</div>

          </div>

          <div class="doc-quote-box">
            <div class="doc-quote-title"><span>Rincian</span><span>Jumlah (Rp)</span></div>

            ${diskonNominalAll>0?`<div class="doc-quote-total-row"><span>Diskon</span><span>-${rupiah(diskonNominalAll)}</span></div>`:''}

            </div>

              <div class="doc-sign-label">Informasi Pembayaran</div>

            <button class="btn btn-secondary" id="btnSendWA">${ICONS.whatsapp} Kirim WA</button>

  document.getElementById('btnEditPayment').addEventListener('click', ()=> openEditPaymentModal(invoice, orders));

function ensureLogoBeforeSend(cb){
  if(!state.settings.logoSvg){
    if(confirm('Logo usaha belum diunggah. Invoice akan tampil tanpa logo. Lanjutkan tanpa logo?')){
      cb();
    }
    return;
  }
  cb();
}

function undoMergeInvoice(invoice){
  if(!invoice || !invoice.isMerged) return;
  if(!confirm('Batalkan penggabungan invoice ini? Setiap pesanan akan dikembalikan ke invoice individual masing-masing.')) return;
  const orders = getInvoiceOrders(invoice);
  orders.forEach(o=>{ o.mergedInto = null; });
  state.invoices = state.invoices.filter(i=>i.id!==invoice.id);
  persist();
  toast('Penggabungan invoice dibatalkan');
  goTo('riwayat');
}

}

async function generateDocumentPdf(opts){
  if(!window.jspdf){
    toast('Perlu koneksi internet untuk unduh PDF. Coba tombol Cetak lalu pilih "Simpan sebagai PDF".', ICONS.close);
    return;
  }
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'pt', format:'a4'});
    const marginX = 48, pageW = 595.28, rightX = pageW - marginX;
    let y = 54;

    const logo = await getLogoPngForPdf();
    const showNameText = !logo || !state.settings.logoIncludesName;
    let headerBottom = y;
    if(logo && showNameText){
      const boxW=90, boxH=34;
      const ratio = Math.min(boxW/logo.w, boxH/logo.h, 1);
      const w=logo.w*ratio, h=logo.h*ratio;
      doc.addImage(logo.dataUrl, 'PNG', marginX, y-4, w, h);
      doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(17);
      doc.text(state.settings.namaUsaha||'Percetakan', marginX+w+10, y+18);
      headerBottom = Math.max(y+h+2, y+22);
    } else if(logo && !showNameText){
      const boxW=150, boxH=50;
      const ratio = Math.min(boxW/logo.w, boxH/logo.h, 1);
      const w=logo.w*ratio, h=logo.h*ratio;
      doc.addImage(logo.dataUrl, 'PNG', marginX, y-6, w, h);
      headerBottom = y-6+h;
    } else {
      doc.setFont('helvetica','bold'); doc.setFontSize(20); doc.setTextColor(17);
      doc.text(state.settings.namaUsaha||'Percetakan', marginX, y+10);
      headerBottom = y+14;
    }
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(110);
    let cy = y-2;
    const contactLines = [];
    if(state.settings.alamat) contactLines.push(state.settings.alamat);
    if(state.settings.noWA) contactLines.push('WA '+state.settings.noWA);
    contactLines.forEach(line=>{
      doc.text(line, rightX, cy, {align:'right', maxWidth:260});
      cy += 11;
    });
    headerBottom = Math.max(headerBottom, cy);

    y = headerBottom + 18;
    doc.setDrawColor(20); doc.setLineWidth(1.3);
    doc.line(marginX, y, rightX, y);
    y += 20;
    doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(17);
    doc.text(opts.titleText, marginX, y);
    y += 10;
    doc.setDrawColor(20); doc.setLineWidth(0.8);
    doc.line(marginX, y, rightX, y);
    y += 26;

    const colW = (rightX-marginX)/3;
    const cols = [
      {label:'PESANAN', value: opts.pesananLabel||'-'},
      {label: opts.docNumberLabel, value: opts.docNumberValue, sub: opts.dateStr},
      {label: opts.statusLabel||'STATUS', value: opts.statusValueText||'-'},
    ];
    const gridStartY = y;
    let gridMaxY = y;
    cols.forEach((c,i)=>{
      const cx = marginX + i*colW;
      doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(17);
      doc.text(c.label, cx, gridStartY);
      doc.setDrawColor(200); doc.setLineWidth(0.6);
      doc.line(cx, gridStartY+4, cx+colW-14, gridStartY+4);
      doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(30);
      doc.text(String(c.value), cx, gridStartY+20, {maxWidth: colW-16});
      let colY = gridStartY+20;
      if(c.sub){
        doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(130);
        doc.text(c.sub, cx, gridStartY+33);
        colY = gridStartY+33;
      }
      gridMaxY = Math.max(gridMaxY, colY);
    });
    y = gridMaxY + 26;

    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(17);
    doc.text('DITAGIHKAN KEPADA', marginX, y);
    doc.setDrawColor(200); doc.setLineWidth(0.6);
    doc.line(marginX, y+4, marginX+180, y+4);
    y += 20;
    doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(30);
    doc.text(opts.customer.nama||'-', marginX, y);
    y += 13;
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(120);
    doc.text(opts.customer.noWA||'-', marginX, y);
    y += 26;

    const boxX = marginX, boxW = rightX-marginX;
    const rows = [];
    opts.groups.forEach(g=>{
      if(opts.groups.length>1 && g.label) rows.push({type:'subhead', text:g.label});
      g.items.forEach(item=>{
        rows.push({type:'item', name: itemDisplayNamePlain(item), calc: itemInvoiceCalcLine(item), amount: rupiah(item.subtotal)});
      });
      (g.biayaTambahan||[]).forEach(b=> rows.push({type:'fee', name:b.nama, amount: rupiah(b.nominal)}));
    });
    rows.push({type:'total', label:'Subtotal', value: rupiah(opts.subtotal)});
    if(opts.diskon>0) rows.push({type:'total', label:'Diskon', value: `-${rupiah(opts.diskon)}`});
    rows.push({type:'total', label:'Total', value: rupiah(opts.total), final:true});
    (opts.extraTotalRows||[]).forEach(r=> rows.push({type:'total', label:r.label, value:r.value, bold:r.bold}));

    function rowHeight(r){
      if(r.type==='subhead') return 22;
      if(r.type==='item') return 32;
      if(r.type==='fee') return 20;
      if(r.type==='total') return r.final ? 30 : 20;
      return 16;
    }
    const padTop=20, padBottom=20, padX=18;
    let boxContentH = 26;
    rows.forEach(r=> boxContentH += rowHeight(r));
    const boxH = padTop+padBottom+boxContentH;

    if(y+boxH > 780){ doc.addPage(); y = 56; }
    const boxTop = y;
    doc.setFillColor(240,240,240);
    doc.rect(boxX, boxTop, boxW, boxH, 'F');

    let ry = boxTop+padTop+2;
    doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(17);
    doc.text('RINCIAN', boxX+padX, ry);
    doc.text('JUMLAH (RP)', boxX+boxW-padX, ry, {align:'right'});
    ry += 6;
    doc.setDrawColor(190); doc.setLineWidth(0.6);
    doc.line(boxX+padX, ry+4, boxX+boxW-padX, ry+4);
    ry += 20;

    rows.forEach(r=>{
      if(r.type==='subhead'){
        doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(60);
        doc.text(r.text, boxX+padX, ry);
        ry += rowHeight(r);
      } else if(r.type==='item'){
        doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(22);
        doc.text(r.name, boxX+padX, ry, {maxWidth: boxW-2*padX-110});
        doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(22);
        doc.text(r.amount, boxX+boxW-padX, ry, {align:'right'});
        ry += 14;
        doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(120);
        doc.text(r.calc, boxX+padX, ry, {maxWidth: boxW-2*padX-110});
        ry += rowHeight(r)-14;
      } else if(r.type==='fee'){
        doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(40);
        doc.text(r.name, boxX+padX, ry);
        doc.text(r.amount, boxX+boxW-padX, ry, {align:'right'});
        ry += rowHeight(r);
      } else if(r.type==='total'){
        if(r.final){
          doc.setDrawColor(170); doc.setLineWidth(0.8);
          doc.line(boxX+padX, ry-10, boxX+boxW-padX, ry-10);
          doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(17);
        } else {
          doc.setFont('helvetica', r.bold?'bold':'normal'); doc.setFontSize(9.5); doc.setTextColor(r.bold?17:60);
        }
        doc.text(r.label, boxX+padX, ry);
        doc.text(r.value, boxX+boxW-padX, ry, {align:'right'});
        ry += rowHeight(r);
      }
    });

    y = boxTop + boxH + 26;

    // Tanda tangan + info bank
    const signY = y;
    const halfW = (boxW - 20) / 2;

    // Kiri: tanda tangan
    doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(100);
    doc.text('HORMAT KAMI,', marginX, signY);
    doc.setDrawColor(180); doc.setLineWidth(0.5);
    doc.line(marginX, signY + 30, marginX + 100, signY + 30);
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(30);
    doc.text(opts.namaUsaha||'Percetakan', marginX, signY + 40);

    // Kanan: info bank
    const bankX = marginX + halfW + 20;
    doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(100);
    doc.text('INFORMASI PEMBAYARAN', bankX, signY);
    if(opts.bankInfo){
      const bankLines = opts.bankInfo.split('\n').filter(l=>l.trim());
      doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(30);
      bankLines.forEach((line, i)=>{
        doc.text(line, bankX, signY + 14 + (i * 13), {maxWidth: halfW});
      });
    } else {
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(160);
      doc.text('(belum diatur)', bankX, signY + 14);
    }

    y = signY + 56;
    doc.setDrawColor(210); doc.setLineWidth(0.4);
    doc.line(marginX, y, marginX + boxW, y);
    y += 12;
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(150);
    doc.text(opts.footerNote||'Terima kasih.', marginX, y, {maxWidth: boxW});

    doc.save(opts.filename);
    toast('PDF diunduh');
  }catch(err){
    console.error(err);
    toast('Gagal membuat PDF', ICONS.close);
  }
}

async function downloadInvoicePdf(orders, invoice){
  const payment = getInvoicePayment(invoice, orders);
  const customer = orders[0].customer;
  let subtotalItemsAll = 0, biayaTotalAll = 0, diskonNominalAll = 0;
  const groups = orders.map((order, idx)=>{
    const subtotalItems = order.items.reduce((s,i)=>s+i.subtotal,0);
    const biayaTotal = (order.biayaTambahan||[]).reduce((s,b)=>s+b.nominal,0);
    const diskonNominal = order.diskon && order.diskon.nilai>0
      ? (order.diskon.tipe==='persen' ? (subtotalItems+biayaTotal)*(order.diskon.nilai/100) : order.diskon.nilai)
      : 0;
    subtotalItemsAll += subtotalItems; biayaTotalAll += biayaTotal; diskonNominalAll += diskonNominal;
    return {
      label: invoice.isMerged ? ((order.namaPesanan||'').trim() || `Pesanan ${idx+1}`) + ` · ${fmtDateShort(order.tanggal)}` : null,
      items: order.items, biayaTambahan: order.biayaTambahan,
    };
  });
  const sisaTagihan = payment.statusPembayaran==='DP' ? Math.max(0, payment.total-payment.nominalDP) : (payment.statusPembayaran==='Belum Bayar' ? payment.total : 0);
  const extraTotalRows = [];
  if(payment.statusPembayaran==='DP'){
    extraTotalRows.push({label:'DP dibayar', value: rupiah(payment.nominalDP)});
    extraTotalRows.push({label:'Sisa tagihan', value: rupiah(sisaTagihan), bold:true});
  } else if(payment.statusPembayaran==='Belum Bayar'){
    extraTotalRows.push({label:'Sisa tagihan', value: rupiah(sisaTagihan), bold:true});
  }
  const pesananLabel = invoice.isMerged ? `Gabungan ${orders.length} pesanan` : ((orders[0].namaPesanan||'').trim() || '-');
  await generateDocumentPdf({
    titleText: 'INVOICE',
    docNumberLabel: 'NO. INVOICE',
    docNumberValue: `INV-${String(invoice.nomorInvoice).padStart(4,'0')}`,
    dateStr: fmtDate(invoice.tanggal),
    pesananLabel,
    statusLabel: 'STATUS',
    statusValueText: payment.statusPembayaran,
    customer,
    groups,
    subtotal: subtotalItemsAll+biayaTotalAll,
    diskon: diskonNominalAll,
    total: payment.total,
    extraTotalRows,
    filename: `Invoice-INV-${String(invoice.nomorInvoice).padStart(4,'0')}.pdf`,
    footerNote: 'Terima kasih atas pesanan Anda.',
    namaUsaha: state.settings.namaUsaha||'Percetakan',
    bankInfo: state.settings.bankInfo||'',
  });
}

function sendInvoiceWA(orders, invoice){
  const payment = getInvoicePayment(invoice, orders);
  const customer = orders[0].customer;
  let subtotalItemsAll = 0, biayaTotalAll = 0, diskonNominalAll = 0;
  const lines = [];
  lines.push(`Halo ${customer.nama}, berikut ringkasan invoice dari ${state.settings.namaUsaha}:`);
  lines.push(`No. Invoice: INV-${String(invoice.nomorInvoice).padStart(4,'0')}`);
  lines.push('');
  orders.forEach((order, oidx)=>{
    if(invoice.isMerged){
      const waOrderLabel = (order.namaPesanan||'').trim() || `Pesanan ${oidx+1}`;
      lines.push(`${waOrderLabel} (${fmtDateShort(order.tanggal)}):`);
    }
    order.items.forEach(item=>{
      lines.push(`- ${itemDisplayNamePlain(item)} (${itemDetailText(item)}): ${rupiah(item.subtotal)}`);
    });
    (order.biayaTambahan||[]).forEach(b=> lines.push(`- ${b.nama}: ${rupiah(b.nominal)}`));
    const subtotalItems = order.items.reduce((s,i)=>s+i.subtotal,0);
    const biayaTotal = (order.biayaTambahan||[]).reduce((s,b)=>s+b.nominal,0);
    const diskonNominal = order.diskon && order.diskon.nilai>0
      ? (order.diskon.tipe==='persen' ? (subtotalItems+biayaTotal)*(order.diskon.nilai/100) : order.diskon.nilai)
      : 0;
    subtotalItemsAll += subtotalItems; biayaTotalAll += biayaTotal; diskonNominalAll += diskonNominal;
  });
  lines.push('');
  if(diskonNominalAll>0) lines.push(`Diskon: -${rupiah(diskonNominalAll)}`);
  lines.push(`Total: ${rupiah(payment.total)}`);
  if(payment.statusPembayaran==='DP'){
    lines.push(`DP dibayar: ${rupiah(payment.nominalDP)}`);
    lines.push(`Sisa tagihan: ${rupiah(Math.max(0,payment.total-payment.nominalDP))}`);
  } else if(payment.statusPembayaran==='Belum Bayar'){
    lines.push(`Status: Belum Bayar`);
  } else {
    lines.push(`Status: Lunas`);
  }
  lines.push('');
  lines.push('(Lampiran PDF invoice dapat dikirim setelah diunduh dari menu Invoice)');
  const text = encodeURIComponent(lines.join('\n'));
  const phone = (customer.noWA||'').replace(/[^0-9]/g,'').replace(/^0/,'62');
  const url = phone ? `https://wa.me/${phone}?text=${text}` : `https://wa.me/?text=${text}`;
  window.open(url, '_blank');
}

function deleteQuotationFromHistory(quotationId){
  const q = state.quotations.find(x=>x.id===quotationId);
  if(!q) return;
  const warn = q.status==='Dikonversi'
    ? 'Quotation ini sudah dikonversi menjadi invoice. Menghapus riwayat quotation TIDAK akan menghapus invoice-nya. Lanjutkan hapus riwayat quotation ini?'
    : 'Hapus riwayat quotation ini? Tindakan tidak bisa dibatalkan.';
  if(!confirm(warn)) return;
  state.quotations = state.quotations.filter(x=>x.id!==quotationId);
  if(currentQuotationId===quotationId) currentQuotationId = null;
  persist();
  toast('Riwayat quotation dihapus');
  renderQuotationPage(currentQuotationId);
}

function bindQuotationHistoryEvents(){
  document.querySelectorAll('[data-quo-filter]').forEach(b=>{
    b.addEventListener('click', ()=>{ quotationRiwayatFilter = b.dataset.quoFilter; renderQuotationPage(currentQuotationId); });
  });
  document.querySelectorAll('[data-quo-hist-id]').forEach(row=>{
    row.addEventListener('click', ()=> goTo('quotation', {quotationId: row.dataset.quoHistId}));
  });
  document.querySelectorAll('[data-delete-quo]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      deleteQuotationFromHistory(btn.dataset.deleteQuo);
    });
  });
}

let marginUnlocked = false;

function currentFilteredOrders(){
  let orders = [...state.orders];
  if(riwayatFilter!=='Semua') orders = orders.filter(o=>o.statusPesanan===riwayatFilter);
  return orders;
}

function renderMarginCard(forceUnlocked){
  const card = document.getElementById('marginCard');
  if(!card) return;
  if(forceUnlocked!==undefined) marginUnlocked = forceUnlocked || marginUnlocked;
  const orders = currentFilteredOrders();

  if(!marginUnlocked){
    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <div>
          <h3>Total Margin (Keuntungan)</h3>
          <p class="desc" style="margin:0">Dilindungi PIN. Klik untuk melihat.</p>
        </div>
        <button class="btn btn-secondary btn-sm" id="btnUnlockMargin">${ICONS.lock} Lihat Margin</button>
      </div>
    `;
    document.getElementById('btnUnlockMargin').addEventListener('click', ()=>{
      askPinInline(document.getElementById('marginCard'), ()=>{
        marginUnlocked = true;
        renderMarginCard();
      });
    });
    return;
  }

  let total = 0, vendorOrderCount = 0, hasNonVendor = false;
  orders.forEach(o=>{
    const info = orderMarginInfo(o);
    if(info.hasVendorItem){ total += info.total; vendorOrderCount++; }
    if(info.hasNonVendorItem) hasNonVendor = true;
  });

  card.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap">
      <div>
        <h3>Total Margin (Keuntungan)</h3>
        <p class="desc" style="margin:0">Dari ${vendorOrderCount} pesanan berisi produk titip vendor, sesuai filter status saat ini.</p>
      </div>
      <div style="font-size:22px;font-weight:800;color:var(--success)">${rupiah(total)}</div>
    </div>
    ${hasNonVendor?`<div class="field-hint" style="margin-top:8px">Produk "Produksi Sendiri" tidak dihitung di sini karena biaya bahan/produksi tidak dicatat di aplikasi — hanya margin produk titip vendor (harga jual − harga vendor) yang ditampilkan.</div>`:''}
  `;
}

function askPinInline(container, onSuccess){
  container.innerHTML = `
    <h3>${ICONS.lock} Masukkan PIN</h3>
    <div class="field-row" style="margin-top:8px">
      <div class="field"><input type="password" inputmode="numeric" id="marginPinInput" placeholder="PIN" autofocus></div>
      <button class="btn btn-primary" id="marginPinSubmit">${ICONS.unlock} Buka</button>
    </div>
    <div class="field-hint" id="marginPinError" style="color:var(--danger);display:none;margin-top:6px">PIN salah, coba lagi.</div>
  `;
  const submit = ()=>{
    const val = document.getElementById('marginPinInput').value;
    if(val === state.settings.securityPin){ onSuccess(); }
    else{ document.getElementById('marginPinError').style.display='block'; }
  };
  document.getElementById('marginPinSubmit').addEventListener('click', submit);
  document.getElementById('marginPinInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') submit(); });
}

function updateMergeBar(){
  const bar = document.getElementById('mergeActionBar');
  if(!bar) return;
  const n = selectedOrderIds.size;
  bar.style.display = n>=1 ? 'flex' : 'none';
  document.getElementById('mergeInfo').textContent = `${n} pesanan dipilih`;
  const doBtn = document.getElementById('btnDoMerge');
  if(doBtn) doBtn.disabled = n<2;
}

function deleteOrderFromHistory(orderId){
  const order = state.orders.find(o=>o.id===orderId);
  if(!order) return;
  if(order.mergedInto){
    toast('Pesanan ini sudah digabung ke invoice lain. Batalkan penggabungan dulu sebelum menghapus.');
    return;
  }
  if(!confirm('Hapus riwayat transaksi ini beserta invoice-nya? Tindakan tidak bisa dibatalkan.')) return;
  state.invoices = state.invoices.filter(inv => !(!inv.isMerged && inv.orderId === orderId));
  state.orders = state.orders.filter(o=>o.id!==orderId);
  selectedOrderIds.delete(orderId);
  persist();
  toast('Riwayat transaksi dihapus');
  renderRiwayatList();
}

function renderRiwayatList(){
  const list = document.getElementById('riwayatList');
  let orders = [...state.orders].sort((a,b)=> new Date(b.tanggal)-new Date(a.tanggal));
  if(riwayatFilter!=='Semua') orders = orders.filter(o=>o.statusPesanan===riwayatFilter);
  if(orders.length===0){
    list.innerHTML = `<div class="empty-state">${ICONS.history}<h3>Belum ada transaksi</h3><p>Transaksi yang dibuat akan muncul di sini.</p></div>`;
    updateMergeBar();
    return;
  }
  list.innerHTML = orders.map(o=>{
    const inv = getOrderInvoice(o);
    const payment = inv ? getInvoicePayment(inv, getInvoiceOrders(inv)) : {statusPembayaran:o.statusPembayaran};
    const payBadge = payment.statusPembayaran==='Lunas' ? 'badge-green' : payment.statusPembayaran==='DP' ? 'badge-orange' : 'badge-red';
    const isMergedAway = !!o.mergedInto;
    return `
    <div class="list-row">
      ${isMergedAway ? '' : `<input type="checkbox" class="order-select-cb" data-select-order="${o.id}" ${selectedOrderIds.has(o.id)?'checked':''} style="width:17px;height:17px;flex-shrink:0;accent-color:var(--accent)">`}
      <div class="list-avatar">${o.customer.nama ? o.customer.nama.trim()[0].toUpperCase() : '?'}</div>
      <div class="list-main" data-order-id="${o.id}">
        <div class="list-title">${orderDisplayTitle(o)} ${inv?`&middot; <span style="color:var(--text-secondary);font-weight:600">INV-${String(inv.nomorInvoice).padStart(4,'0')}</span>`:''}</div>
        <div class="list-sub">${fmtDateShort(o.tanggal)} &middot; ${o.items.length} item</div>
        <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
          <select class="status-select" data-order-id-sel="${o.id}" data-field="statusPesanan">
            ${STATUS_PESANAN_LIST.map(s=>`<option value="${s}" ${o.statusPesanan===s?'selected':''}>${s}</option>`).join('')}
          </select>
          <span class="badge ${payBadge}">${payment.statusPembayaran}</span>
          ${isMergedAway?`<span class="badge badge-blue">Digabung</span>`:''}
        </div>
      </div>
      <div class="list-right">
        <div class="list-amount">${rupiah(o.total)}</div>
        <div style="display:flex;gap:4px;align-items:center">
          <button class="btn btn-sm btn-secondary" data-open-invoice="${inv?inv.id:''}">Buka Invoice</button>
          <button class="icon-btn" data-delete-order="${o.id}" title="${isMergedAway?'Batalkan penggabungan dulu untuk menghapus':'Hapus riwayat transaksi'}" ${isMergedAway?'disabled style="opacity:.35;cursor:not-allowed"':''}>${ICONS.trash}</button>
        </div>
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('[data-select-order]').forEach(cb=>{
    cb.addEventListener('click', (e)=> e.stopPropagation());
    cb.addEventListener('change', ()=>{
      if(cb.checked) selectedOrderIds.add(cb.dataset.selectOrder);
      else selectedOrderIds.delete(cb.dataset.selectOrder);
      updateMergeBar();
    });
  });
  list.querySelectorAll('[data-field="statusPesanan"]').forEach(sel=>{
    sel.addEventListener('click', e=>e.stopPropagation());
    sel.addEventListener('change', ()=>{
      const o = state.orders.find(x=>x.id===sel.dataset.orderIdSel);
      if(o){ o.statusPesanan = sel.value; persist(); toast('Status pesanan diperbarui'); }
    });
  });
  list.querySelectorAll('[data-open-invoice]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(btn.dataset.openInvoice){ goTo('invoice', {invoiceId: btn.dataset.openInvoice}); }
    });
  });
  list.querySelectorAll('.list-main[data-order-id]').forEach(main=>{
    main.addEventListener('click', ()=>{
      const o = state.orders.find(x=>x.id===main.dataset.orderId);
      if(o) openOrderDetailModal(o);
    });
  });
  list.querySelectorAll('[data-delete-order]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(btn.disabled) return;
      deleteOrderFromHistory(btn.dataset.deleteOrder);
    });
  });
  updateMergeBar();

  document.getElementById('btnCancelMerge')?.addEventListener('click', ()=>{
    selectedOrderIds.clear();
    renderRiwayatList();
  });
  document.getElementById('btnDoMerge')?.addEventListener('click', openMergeConfirmModal);
}

function openMergeConfirmModal(){
  const ids = [...selectedOrderIds];
  if(ids.length<2) return;
  const orders = ids.map(id=>state.orders.find(o=>o.id===id)).filter(Boolean);
  const waSet = new Set(orders.map(o=>o.customer.noWA.trim()));
  if(waSet.size>1){
    toast('Pesanan yang digabung harus dari customer yang sama', ICONS.close);
    return;
  }
  const grandTotal = orders.reduce((s,o)=>s+o.total,0);
  openModal(`
    <div class="modal-head"><h3>Gabungkan ${orders.length} Pesanan</h3><button class="icon-btn" data-action="close-modal">${ICONS.close}</button></div>
    <div class="modal-body">
      <div class="field-hint">Customer: <b>${escapeHtml(orders[0].customer.nama)}</b> (${escapeHtml(orders[0].customer.noWA)})</div>
      <div class="list-card">
        ${orders.map(o=>`
          <div class="list-row">
            <div class="list-main">
              <div class="list-title">${fmtDateShort(o.tanggal)} &middot; ${o.items.length} item</div>
              <div class="list-sub">${o.items.map(i=>escapeHtml(i.nama)).join(', ')}</div>
            </div>
            <div class="list-amount">${rupiah(o.total)}</div>
          </div>
        `).join('')}
      </div>
      <div class="calc-preview"><span>Total gabungan</span><span>${rupiah(grandTotal)}</span></div>
      <div class="field-hint">Invoice individual sebelumnya akan digantikan oleh 1 invoice baru dengan nomor baru. Status pembayaran akan dikelola di invoice gabungan.</div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-secondary" data-action="close-modal">Batal</button>
      <button class="btn btn-primary" id="btnConfirmMerge">${ICONS.merge} Buat Invoice Gabungan</button>
    </div>
  `);
  document.getElementById('btnConfirmMerge').addEventListener('click', ()=>{
    const newInvoice = {
      id: uid(),
      nomorInvoice: state.settings.nextInvoiceNumber,
      isMerged: true,
      orderIds: orders.map(o=>o.id),
      tanggal: new Date().toISOString(),
      statusPembayaran: 'Belum Bayar',
      nominalDP: 0,
      total: grandTotal,
    };
    state.settings.nextInvoiceNumber += 1;
    orders.forEach(o=>{ o.mergedInto = newInvoice.id; });
    state.invoices.push(newInvoice);
    persist();
    closeModal();
    selectedOrderIds.clear();
    goTo('invoice', {invoiceId: newInvoice.id});
    toast('Invoice gabungan dibuat');
  });
}

          <button class="btn btn-secondary" id="btnExportBackup">${ICONS.download} Ekspor Backup (JSON)</button>
          <label class="btn btn-secondary" style="cursor:pointer">${ICONS.file} Impor Backup
            <input type="file" id="importBackupFile" accept="application/json" style="display:none">
          </label>
        </div>
      </div>

      <div class="settings-card">
        <h3>Reset Data</h3>
        <p class="desc">Menghapus seluruh produk, pesanan, invoice, quotation, dan riwayat secara permanen.</p>
        <button class="btn btn-danger" id="btnResetAll">${ICONS.trash} Reset Semua Data</button>
      </div>
    </div>
  `;

  document.getElementById('btnChangePin').addEventListener('click', openChangePinModal);

  document.getElementById('btnSaveSettings').addEventListener('click', ()=>{
    state.settings.namaUsaha = document.getElementById('setNamaUsaha').value.trim() || DEFAULT_SETTINGS.namaUsaha;
    state.settings.alamat = document.getElementById('setAlamat').value.trim();
    state.settings.noWA = document.getElementById('setNoWA').value.trim();
    state.settings.bankInfo = document.getElementById('setBankInfo').value.trim();
    persist();
    toast('Informasi usaha disimpan');
  });

  document.getElementById('logoFileInput').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const isSvg = file.type==='image/svg+xml' || file.name.toLowerCase().endsWith('.svg');
    if(!isSvg){ toast('File harus format SVG', ICONS.close); e.target.value=''; return; }
    const reader = new FileReader();
    reader.onload = ()=>{
      const raw = String(reader.result);
      if(!/<svg[\s>]/i.test(raw)){ toast('File SVG tidak valid', ICONS.close); return; }
      const clean = sanitizeSvg(raw);
      state.settings.logoSvg = `data:image/svg+xml;utf8,${encodeURIComponent(clean)}`;
      persist();
      toast('Logo diunggah');
      renderPengaturanPage();
    };
    reader.onerror = ()=> toast('Gagal membaca file', ICONS.close);
    reader.readAsText(file);
  });

  document.getElementById('btnRemoveLogo')?.addEventListener('click', ()=>{
    if(!confirm('Hapus logo usaha?')) return;
    state.settings.logoSvg = '';
    persist();
    toast('Logo dihapus');
    renderPengaturanPage();
  });

  document.getElementById('setLogoIncludesName').addEventListener('change', (e)=>{
    state.settings.logoIncludesName = e.target.checked;
    persist();
  });

  document.getElementById('btnLogoutGoogle')?.addEventListener('click', signOutOfGoogle);
  document.getElementById('btnExportBackup').addEventListener('click', exportBackup);
  document.getElementById('importBackupFile').addEventListener('change', importBackup);
  document.getElementById('btnResetAll').addEventListener('click', ()=>{
    if(confirm('Yakin ingin menghapus SEMUA data (produk, pesanan, invoice, quotation, riwayat)? Tindakan ini tidak bisa dibatalkan.')){
      localStorage.removeItem('products');
      localStorage.removeItem('orders');
      localStorage.removeItem('invoices');
      localStorage.removeItem('quotations');
      localStorage.removeItem('settings');
      state = loadState();
      persist();
      toast('Semua data telah direset');
      goTo('produk');
    }
  });
}

function openChangePinModal(){
  const hasPin = !!state.settings.securityPin;
  openModal(`
    <div class="modal-head"><h3>Ubah PIN Keamanan</h3><button class="icon-btn" data-action="close-modal">${ICONS.close}</button></div>
    <div class="modal-body">
      ${hasPin?`<div class="field"><label>PIN saat ini</label><input type="password" inputmode="numeric" id="pinOld"></div>`:''}
      <div class="field"><label>PIN baru (4-6 digit)</label><input type="password" inputmode="numeric" id="pinNew"></div>
      <div class="field"><label>Ulangi PIN baru</label><input type="password" inputmode="numeric" id="pinNew2"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-secondary" data-action="close-modal">Batal</button>
      <button class="btn btn-primary" id="btnSavePin">${ICONS.check} Simpan PIN</button>
    </div>
  `);
  document.getElementById('btnSavePin').addEventListener('click', ()=>{
    if(hasPin){
      const old = document.getElementById('pinOld').value;
      if(old !== state.settings.securityPin){ toast('PIN saat ini salah', ICONS.close); return; }
    }
    const n1 = document.getElementById('pinNew').value;
    const n2 = document.getElementById('pinNew2').value;
    if(n1.length<4 || n1.length>6){ toast('PIN harus 4-6 digit', ICONS.close); return; }
    if(n1!==n2){ toast('Konfirmasi PIN tidak cocok', ICONS.close); return; }
    state.settings.securityPin = n1;
    persist();
    closeModal();
    toast('PIN berhasil diubah');
  });
}

function renderCatList(){
  const wrap = document.getElementById('catList');
  if(state.settings.categories.length===0){
    wrap.innerHTML = `<div class="field-hint">Belum ada kategori.</div>`;
    return;
  }
  wrap.innerHTML = state.settings.categories.map(c=>`
    <div class="cat-manage-row">
      <span>${escapeHtml(c)}</span>
      <button class="icon-btn" data-remove-cat="${escapeHtml(c)}">${ICONS.trash}</button>
    </div>
  `).join('');
  wrap.querySelectorAll('[data-remove-cat]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const cat = btn.dataset.removeCat;
      const inUse = state.products.some(p=>p.kategoriTampilan===cat);
      if(inUse && !confirm(`Kategori "${cat}" masih dipakai produk. Hapus tetap?`)) return;
      state.settings.categories = state.settings.categories.filter(x=>x!==cat);
      if(produkFilter.kategori===cat) produkFilter.kategori='Semua';
      persist();
      renderProdukPage();
    });
  });
}

function exportBackup(){
  const data = {
    exportedAt: new Date().toISOString(),
    products: state.products, orders: state.orders, invoices: state.invoices, quotations: state.quotations, settings: state.settings
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `backup-kasir-percetakan-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Backup diekspor');
}

function importBackup(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!confirm('Impor akan menggantikan seluruh data saat ini. Lanjutkan?')) return;
      state.products = Array.isArray(data.products) ? data.products : state.products;
      state.orders = Array.isArray(data.orders) ? data.orders : state.orders;
      state.invoices = Array.isArray(data.invoices) ? data.invoices : state.invoices;
      state.quotations = Array.isArray(data.quotations) ? data.quotations : state.quotations;
      state.settings = data.settings && typeof data.settings==='object' ? {...DEFAULT_SETTINGS, ...data.settings} : state.settings;
      persist();
      toast('Backup berhasil diimpor');
      renderPengaturanPage();
    }catch(err){
      console.error(err);
      toast('File backup tidak valid', ICONS.close);
    }
  };
  reader.readAsText(file);
  e.target.value='';
}

/* ================================================================
   PWA: register service worker (only works over https/localhost)
   ================================================================ */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{
      // fails silently if opened as file:// or without a server — app still works normally
    });
  });
  // Ketika versi service worker baru aktif, otomatis reload sekali
  // supaya update selalu langsung terlihat tanpa perlu refresh manual 2x.
  let swAutoReloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(swAutoReloaded) return;
    swAutoReloaded = true;
    window.location.reload();
  });
}

   INIT
   ================================================================ */
document.getElementById('btnGoogleLogin').addEventListener('click', signInWithGoogle);

renderSidebar();
goTo('dashboard');

  document.getElementById('loginGate').style.display = 'none';
  document.getElementById('app').style.display = '';
} else {
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginGate').style.display = 'flex';
  initFirebaseSync();
}


</script>
